# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Release - Android"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Android app to package."
        required: true
        type: choice
        options:
          - garden
          - delivery
      createGithubRelease:
        description: "Create/update a draft GitHub release containing the Play handoff."
        required: true
        default: true
        type: boolean
      releaseTarget:
        description: "Validation target for the signed handoff. Delivery internal-test may omit Store screenshots."
        required: true
        default: full-handoff
        type: choice
        options:
          - full-handoff
          - internal-test

concurrency:
  group: android-release-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: "Package ${{ inputs.app }} for Google Play"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: "Google Play - ${{ inputs.app }}"
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: 🏷️ Resolve source-controlled version
        id: version
        shell: bash
        env:
          APP_NAME: ${{ inputs.app }}
        run: |
          set -euo pipefail
          APP_PATH="apps/${APP_NAME}-android"
          PROPERTIES_PATH="${APP_PATH}/gradle.properties"
          VERSION_CODE="$(sed -n 's/^GREDICE_VERSION_CODE=//p' "${PROPERTIES_PATH}")"
          VERSION_NAME="$(sed -n 's/^GREDICE_VERSION_NAME=//p' "${PROPERTIES_PATH}")"

          if ! [[ "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GREDICE_VERSION_CODE must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::GREDICE_VERSION_NAME must be a semantic version." >&2
            exit 1
          fi

          echo "app_path=${APP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=android-${APP_NAME}-v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: 📦 Install pinned Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 🔎 Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: ⚡ Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: 🏪 Validate complete Google Play listing bundle
        shell: bash
        env:
          APP_NAME: ${{ inputs.app }}
          APP_PATH: ${{ steps.version.outputs.app_path }}
          RELEASE_TARGET: ${{ inputs.releaseTarget }}
        run: |
          set -euo pipefail
          VALIDATION_ARGS=("${APP_PATH}")
          if [ "${APP_NAME}" = "delivery" ] && [ "${RELEASE_TARGET}" = "internal-test" ]; then
            VALIDATION_ARGS+=(--allow-missing-screenshots)
          fi
          node scripts/validate-android-store-listing.mjs "${VALIDATION_ARGS[@]}"

      - name: 🔗 Validate Garden TWA contract
        if: inputs.app == 'garden'
        run: node scripts/validate-garden-twa-contract.mjs

      - name: 🚚 Validate Delivery car contract
        if: inputs.app == 'delivery'
        run: node scripts/validate-delivery-car-contract.mjs

      - name: 🔐 Prepare and verify upload key
        shell: bash
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ANDROID_UPLOAD_CERT_SHA256 ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_STORE_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::${NAME} is not configured in the protected environment." >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="${RUNNER_TEMP}/android-upload-keystore.jks"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"

          ACTUAL_FINGERPRINT="$(keytool -J-Duser.language=en -list -v \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" \
            -alias "${ANDROID_UPLOAD_KEY_ALIAS}" \
            | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="$(printf '%s' "${ANDROID_UPLOAD_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [ -z "${ACTUAL_FINGERPRINT}" ] || [ "${ACTUAL_FINGERPRINT}" != "${EXPECTED_FINGERPRINT}" ]; then
            echo "::error::Upload certificate fingerprint does not match the protected environment." >&2
            exit 1
          fi

          echo "ANDROID_UPLOAD_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: 🛠️ Build signed AAB and APK
        working-directory: ${{ steps.version.outputs.app_path }}
        env:
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest bundleRelease assembleRelease

      - name: 🔍 Verify signatures and stage Play handoff
        id: stage
        shell: bash
        env:
          APP_NAME: ${{ inputs.app }}
          APP_PATH: ${{ steps.version.outputs.app_path }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          AAB_PATH="${APP_PATH}/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="${APP_PATH}/app/build/outputs/apk/release/app-release.apk"
          ARTIFACT_PREFIX="gredice-${APP_NAME}-android-${VERSION_NAME}-${VERSION_CODE}"

          jarsigner -verify -verbose -certs "${AAB_PATH}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${APK_PATH}"

          mkdir -p release-artifacts
          cp "${AAB_PATH}" "release-artifacts/${ARTIFACT_PREFIX}.aab"
          cp "${APK_PATH}" "release-artifacts/${ARTIFACT_PREFIX}.apk"
          if [ -f "${APP_PATH}/app/build/outputs/mapping/release/mapping.txt" ]; then
            cp "${APP_PATH}/app/build/outputs/mapping/release/mapping.txt" \
              "release-artifacts/${ARTIFACT_PREFIX}-mapping.txt"
          fi

          (cd "${APP_PATH}" && zip -qr \
            "${GITHUB_WORKSPACE}/release-artifacts/${ARTIFACT_PREFIX}-store-assets.zip" \
            store/google-play/hr-HR)

          {
            echo "app=${APP_NAME}"
            echo "application_version=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "release_target=${{ inputs.releaseTarget }}"
            echo "commit=${GITHUB_SHA}"
            echo "target_sdk=36"
            echo "build_tools=36.0.0"
            echo "java=17"
          } > "release-artifacts/${ARTIFACT_PREFIX}-build-metadata.txt"

          (cd release-artifacts && sha256sum * > SHA256SUMS)
          echo "artifact_prefix=${ARTIFACT_PREFIX}" >> "${GITHUB_OUTPUT}"

      - name: 🧾 Attest signed Android binaries
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            release-artifacts/${{ steps.stage.outputs.artifact_prefix }}.aab
            release-artifacts/${{ steps.stage.outputs.artifact_prefix }}.apk

      - name: 📤 Upload Play handoff artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ steps.stage.outputs.artifact_prefix }}-play-handoff
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 🚀 Create or update draft GitHub release
        if: inputs.createGithubRelease
        uses: softprops/action-gh-release@v2.2.2
        with:
          name: "Gredice ${{ inputs.app }} Android ${{ steps.version.outputs.version_name }}"
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
