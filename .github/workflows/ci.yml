# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the latest CI run per workflow + PR/branch, cancel obsolete in-progress runs.
# For PR events we scope by PR number, and for branch events we scope by ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TEAM: gredice

jobs:
  ui_primitives:
    name: "Validate UI primitive boundary"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - run: bash scripts/ci-isolated-tests.sh node --test scripts/check-ui-primitives.test.mjs
      - run: bash scripts/ci-isolated-tests.sh node --test scripts/blob-test-fixtures.test.mjs
      - run: bash scripts/ci-isolated-tests.sh node scripts/ci-network-isolation-check.mjs
      - run: node scripts/check-ui-primitives.mjs

  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            app_www:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/www/**
              - packages/client/**
              - packages/directory-types/**
              - packages/game/**
              - packages/js/**
              - packages/storage/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_news:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/news/**
              - packages/js/**
              - packages/storage/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_garden:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/garden/**
              - packages/client/**
              - packages/game/**
              - packages/js/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_garden_android:
              - apps/garden-android/**
              - apps/garden/app/manifest.json
              - apps/garden/public/.well-known/assetlinks.json
              - scripts/render-svg-png.swift
              - scripts/validate-android-store-listing.mjs
              - scripts/validate-garden-twa-contract.mjs
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            app_farm:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/farm/**
              - packages/auth/**
              - packages/client/**
              - packages/js/**
              - packages/label-printer/**
              - packages/notifications/**
              - packages/storage/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_delivery:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/delivery/**
              - packages/auth/**
              - packages/client/**
              - packages/js/**
              - packages/notifications/**
              - packages/storage/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_delivery_android:
              - apps/delivery-android/**
              - apps/delivery/app/icon.svg
              - apps/delivery/app/manifest.json
              - apps/delivery/public/.well-known/assetlinks.json
              - scripts/digital-asset-links.mjs
              - scripts/digital-asset-links.test.mjs
              - scripts/render-svg-png.swift
              - scripts/validate-android-store-listing.mjs
              - scripts/validate-delivery-car-contract.mjs
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            app_app:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/app/**
              - packages/auth/**
              - packages/client/**
              - packages/directory-types/**
              - packages/email/**
              - packages/fiscalization/**
              - packages/js/**
              - packages/notifications/**
              - packages/signalco/**
              - packages/storage/**
              - packages/stripe/**
              - packages/transactional/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_api:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/api/**
              - packages/auth/**
              - packages/directory-types/**
              - packages/email/**
              - packages/fiscalization/**
              - packages/google/**
              - packages/js/**
              - packages/notifications/**
              - packages/signalco/**
              - packages/storage/**
              - packages/stripe/**
              - packages/transactional/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_storybook:
              - apps/storybook/**
              - packages/game/**
              - packages/js/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_status:
              - scripts/blob-test-fixtures.mjs
              - scripts/ci-blob-network-guard.mjs
              - scripts/ci-isolated-tests.sh
              - scripts/ci-test-app.sh
              - scripts/ci-font-fixtures.cjs
              - scripts/ci-api-fixtures.mjs
              - apps/status/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            app_desktop:
              - apps/desktop/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            packages_storage:
              - packages/storage/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            packages_email:
              - packages/email/**
              - packages/storage/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            packages_game:
              - packages/client/**
              - packages/game/**
              - packages/js/**
              - packages/stripe/**
              - packages/ui/**
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
            plugin_package:
              - .agents/plugins/**
              - .claude-plugin/**
              - plugins/**
              - scripts/check-plugins.mjs
              - apps/api/app/api/mcp/catalog.ts
              - package.json
              - .github/workflows/**
    outputs:
      app_www: ${{ steps.filter.outputs.app_www }}
      app_news: ${{ steps.filter.outputs.app_news }}
      app_garden: ${{ steps.filter.outputs.app_garden }}
      app_garden_android: ${{ steps.filter.outputs.app_garden_android }}
      app_farm: ${{ steps.filter.outputs.app_farm }}
      app_delivery: ${{ steps.filter.outputs.app_delivery }}
      app_delivery_android: ${{ steps.filter.outputs.app_delivery_android }}
      app_app: ${{ steps.filter.outputs.app_app }}
      app_api: ${{ steps.filter.outputs.app_api }}
      app_storybook: ${{ steps.filter.outputs.app_storybook }}
      app_status: ${{ steps.filter.outputs.app_status }}
      app_desktop: ${{ steps.filter.outputs.app_desktop }}
      packages_storage: ${{ steps.filter.outputs.packages_storage }}
      packages_email: ${{ steps.filter.outputs.packages_email }}
      packages_game: ${{ steps.filter.outputs.packages_game }}
      plugin_package: ${{ steps.filter.outputs.plugin_package }}

  plugin_package:
    name: "Validate plugins"
    needs: changes
    if: success() && needs.changes.outputs.plugin_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-plugins.mjs

  ci_www:
    name: "CI - www"
    needs: changes
    if: success() && needs.changes.outputs.app_www == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "www"
      path: "apps/www"
      testShardMatrix: >-
        [
          {"name":"a11y 1/3","index":1,"total":5,"args":"tests/a11y.spec.ts --shard=1/3"},
          {"name":"a11y 2/3","index":2,"total":5,"args":"tests/a11y.spec.ts --shard=2/3"},
          {"name":"a11y 3/3","index":3,"total":5,"args":"tests/a11y.spec.ts --shard=3/3"},
          {"name":"rest 1/2","index":4,"total":5,"args":"tests/landing.spec.ts tests/search.spec.ts tests/search-interactive.spec.tsx tests/titlesPresent.spec.ts tests/cms-markdown.spec.tsx tests/blob-network-guard.spec.ts tests/inline-login-dialog.spec.tsx tests/regional-calendar.spec.ts --shard=1/2"},
          {"name":"rest 2/2","index":5,"total":5,"args":"tests/landing.spec.ts tests/search.spec.ts tests/search-interactive.spec.tsx tests/titlesPresent.spec.ts tests/cms-markdown.spec.tsx tests/blob-network-guard.spec.ts tests/inline-login-dialog.spec.tsx tests/regional-calendar.spec.ts --shard=2/2"}
        ]
      testShardPrepareScript: "test:prepare:routes"

  ci_news:
    name: "CI - news"
    needs: changes
    if: success() && needs.changes.outputs.app_news == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "news"
      path: "apps/news"

  ci_garden:
    name: "CI - garden"
    needs: changes
    if: success() && needs.changes.outputs.app_garden == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "garden"
      path: "apps/garden"
      testShardMatrix: >-
        [
          {"name":"chromium 1/2","args":"--project=chromium --shard=1/2"},
          {"name":"chromium 2/2","args":"--project=chromium --shard=2/2"},
          {"name":"webgl components 1/2","args":"--project=chromium-webgl --shard=1/2"},
          {"name":"webgl components 2/2","args":"--project=chromium-webgl --shard=2/2"},
          {"name":"kestenijada route","args":"--config=playwright.kestenijada-route.config.ts"},
          {"name":"pumpkin trail route","args":"--config=playwright.pumpkin-trail-route.config.ts"},
          {"name":"outlet layout","args":"--project=chromium-webgl-outlet --grep @outlet-layout"},
          {"name":"outlet reconcile","args":"--project=chromium-webgl-outlet --grep @outlet-reconcile"},
          {"name":"outlet lifecycle","args":"--project=chromium-webgl-outlet --grep @outlet-lifecycle"},
          {"name":"outlet walk","args":"--project=chromium-webgl-outlet --grep @outlet-walk"},
          {"name":"outlet rest","args":"--project=chromium-webgl-outlet --grep-invert @outlet-slow"}
        ]
      testShardPrepareScript: "test:ci:prepare"

  ci_garden_android:
    name: "CI - garden Android"
    needs: changes
    if: success() && needs.changes.outputs.app_garden_android == 'true'
    uses: ./.github/workflows/android_ci_reusable.yml
    with:
      name: "garden"
      path: "apps/garden-android"
      validateGardenTwaContract: true

  ci_farm:
    name: "CI - farm"
    needs: changes
    if: success() && needs.changes.outputs.app_farm == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "farm"
      path: "apps/farm"

  ci_delivery:
    name: "CI - delivery"
    needs: changes
    if: success() && needs.changes.outputs.app_delivery == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "delivery"
      path: "apps/delivery"

  ci_delivery_android:
    name: "CI - delivery Android"
    needs: changes
    if: success() && needs.changes.outputs.app_delivery_android == 'true'
    uses: ./.github/workflows/android_ci_reusable.yml
    with:
      name: "delivery"
      path: "apps/delivery-android"
      allowMissingStoreScreenshots: true
      validateDeliveryCarContract: true
      compileInstrumentedTests: true

  ci_app:
    name: "CI - app"
    needs: changes
    if: success() && needs.changes.outputs.app_app == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "app"
      path: "apps/app"
      nextBuildCache: true

  ci_api:
    name: "CI - api"
    needs: changes
    if: success() && needs.changes.outputs.app_api == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "api"
      path: "apps/api"

  ci_status:
    name: "CI - status"
    needs: changes
    if: success() && needs.changes.outputs.app_status == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "status"
      path: "apps/status"

  ci_desktop:
    name: "CI - desktop"
    needs: changes
    if: success() && needs.changes.outputs.app_desktop == 'true'
    uses: ./.github/workflows/nextjs_ci_reusable.yml
    with:
      name: "desktop"
      path: "apps/desktop"

  test_packages:
    name: "CI - test @gredice/storage"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    if: success() && github.event_name == 'pull_request' &&
      needs.changes.outputs.packages_storage == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.1.0
        name: ✨ Install pnpm

      - name: ✨ Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - name: ✨ Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6.1.0
        name: ✨ Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦️ Install dependencies
        run: pnpm install --frozen-lockfile --filter @gredice/storage... --filter .

      - name: 📦 Prepare offline package manager
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/gredice-corepack" >> "$GITHUB_ENV"
          COREPACK_HOME="$RUNNER_TEMP/gredice-corepack" pnpm exec corepack pnpm --version

      - name: ⚒️ Test app
        run: bash scripts/ci-isolated-tests.sh --database env -u POSTGRES_URL -u TEST_ENV -u VERCEL_ENV -u NEXT_PUBLIC_VERCEL_ENV pnpm run test --filter=@gredice/storage --cache=local:rw

  test_game_package:
    name: "CI - test @gredice/game and @gredice/js"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: success() && github.event_name == 'pull_request' &&
      needs.changes.outputs.packages_game == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.1.0
        name: ✨ Install pnpm

      - name: ✨ Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - name: ✨ Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6.1.0
        name: ✨ Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦️ Install dependencies
        run: pnpm install --frozen-lockfile --filter @gredice/game... --filter @gredice/js... --filter .

      - name: 📦 Prepare offline package manager
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/gredice-corepack" >> "$GITHUB_ENV"
          COREPACK_HOME="$RUNNER_TEMP/gredice-corepack" pnpm exec corepack pnpm --version

      - name: ⚒️ Test packages
        run: bash scripts/ci-isolated-tests.sh pnpm run test --filter=@gredice/game --filter=@gredice/js --cache=local:rw

  test_email_package:
    name: "CI - test @gredice/email"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: success() && github.event_name == 'pull_request' &&
      needs.changes.outputs.packages_email == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.1.0
        name: ✨ Install pnpm

      - name: ✨ Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - name: ✨ Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6.1.0
        name: ✨ Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦️ Install dependencies
        run: pnpm install --frozen-lockfile --filter @gredice/email... --filter .

      - name: 📦 Prepare offline package manager
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/gredice-corepack" >> "$GITHUB_ENV"
          COREPACK_HOME="$RUNNER_TEMP/gredice-corepack" pnpm exec corepack pnpm --version

      - name: ⚒️ Test package
        run: bash scripts/ci-isolated-tests.sh pnpm --filter @gredice/email test

      - name: 🔎 Typecheck package
        run: pnpm --filter @gredice/email typecheck

  ci_filter_check:
    name: "CI - verify app package filters"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ✨ Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - name: 🔎 Verify CI app filters
        run: node ./scripts/check-ci-filters.mjs

  ci_ok:
    name: "[CI] OK"
    needs:
      [
        ui_primitives,
        changes,
        ci_www,
        ci_news,
        ci_garden,
        ci_garden_android,
        ci_farm,
        ci_delivery,
        ci_delivery_android,
        ci_app,
        ci_api,
        ci_status,
        ci_desktop,
        test_packages,
        test_game_package,
        test_email_package,
        ci_filter_check,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')) }}
