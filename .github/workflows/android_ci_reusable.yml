# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "CI - Android reusable"

on:
  workflow_call:
    inputs:
      name:
        description: "Short artifact/display name."
        required: true
        type: string
      path:
        description: "Android project path from the repository root."
        required: true
        type: string
      allowMissingStoreScreenshots:
        description: "Allow a feasibility app to keep genuine Store captures pending."
        required: false
        default: false
        type: boolean
      validateGardenTwaContract:
        description: "Validate the Garden web/TWA/Digital Asset Links contract."
        required: false
        default: false
        type: boolean
      validateDeliveryCarContract:
        description: "Validate the Delivery POI-only and provider-neutral car contract."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    name: "Android - ${{ inputs.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: 📦 Install pinned Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 🔎 Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: ⚡ Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 🏪 Validate Google Play listing bundle
        shell: bash
        env:
          ALLOW_MISSING_SCREENSHOTS: ${{ inputs.allowMissingStoreScreenshots }}
        run: |
          set -euo pipefail
          ARGS=("${{ inputs.path }}")
          if [ "${ALLOW_MISSING_SCREENSHOTS}" = "true" ]; then
            ARGS+=("--allow-missing-screenshots")
          fi
          node scripts/validate-android-store-listing.mjs "${ARGS[@]}"

      - name: 🔗 Validate Garden TWA contract
        if: inputs.validateGardenTwaContract
        run: node scripts/validate-garden-twa-contract.mjs

      - name: 🚚 Validate Delivery car contract
        if: inputs.validateDeliveryCarContract
        run: node scripts/validate-delivery-car-contract.mjs

      - name: 🛠️ Lint, test, and build unsigned artifacts
        working-directory: ${{ inputs.path }}
        run: ./gradlew --no-daemon --stacktrace lintRelease testDebugUnitTest assembleDebug bundleRelease

      - name: 📤 Upload unsigned Android artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ inputs.name }}-android-unsigned-${{ github.sha }}
          path: |
            ${{ inputs.path }}/app/build/outputs/apk/debug/*.apk
            ${{ inputs.path }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: 📤 Upload Android reports
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ inputs.name }}-android-reports-${{ github.sha }}
          path: |
            ${{ inputs.path }}/app/build/reports/lint-results-*
            ${{ inputs.path }}/app/build/reports/tests/**
            ${{ inputs.path }}/app/build/test-results/**
            ${{ inputs.path }}/app/build/outputs/mapping/release/**
          if-no-files-found: warn
          retention-days: 7
