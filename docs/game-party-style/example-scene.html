<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gredice party style: example scene</title>
<!--
    Design mock for docs/game-party-style.md. Standalone three.js page, not game
    runtime code. The "Today" mode rebuilds the exported BlockGrass, BlockGround,
    RaisedBed, Tree, Bush, StoneMedium, Fence, Sunflower and Bucket GLBs from
    their bounds and material factors, lit with the midday values from
    packages/game/src/scene/Environment.tsx. Textures in the party mode are
    embedded copies of assets/game-textures. Add ?mode=current|code|party to
    open a specific mode.
-->
<style>
    .gps {
        display: grid;
        gap: 12px;
        font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif);
        color: var(--foreground, #1d2420);
        font-size: 14px;
        line-height: 1.45;
    }
    .gps-modes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .gps-modes button {
        font: inherit;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--border, #cfd6cc);
        background: transparent;
        color: inherit;
        cursor: pointer;
    }
    .gps-modes button[aria-pressed='true'] {
        background: var(--primary, #2f7d32);
        border-color: var(--primary, #2f7d32);
        color: var(--primary-foreground, #ffffff);
    }
    .gps-modes button:focus-visible {
        outline: 2px solid var(--ring, #2f7d32);
        outline-offset: 2px;
    }
    .gps-stage {
        position: relative;
        height: 480px;
        border-radius: var(--radius, 12px);
        overflow: hidden;
        background: #f7f1dd;
        transition: background 0.25s ease;
    }
    .gps-stage[data-mode='code'],
    .gps-stage[data-mode='party'] {
        background: linear-gradient(180deg, #4fbcff 0%, #8fd8ff 48%, #d9f5ff 100%);
    }
    .gps-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
    }
    .gps-stage canvas:active {
        cursor: grabbing;
    }
    .gps-fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: #1d2420;
    }
    .gps-summary {
        margin: 0;
        /* Three lines, so switching modes does not shift the layout. */
        min-height: 4.35em;
    }
    .gps-specs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px 16px;
        margin: 0;
    }
    .gps-specs div {
        border-top: 1px solid var(--border, #cfd6cc);
        padding-top: 6px;
    }
    .gps-specs dt {
        font-size: 12px;
        color: var(--muted-foreground, #5d6a60);
    }
    .gps-specs dd {
        margin: 0;
        font-weight: 600;
    }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
}
</script>
</head>
<body>
<div class="gps">
    <div class="gps-modes" role="group" aria-label="Rendering style">
        <button type="button" data-mode="current" aria-pressed="false">Today</button>
        <button type="button" data-mode="code" aria-pressed="false">Renderer only</button>
        <button type="button" data-mode="party" aria-pressed="true">Full party style</button>
    </div>
    <div class="gps-stage" data-mode="party">
        <canvas aria-label="Example garden scene: grass and soil blocks, a raised bed, a tree, a bush, stones, a fence, sunflowers and a bucket"></canvas>
        <div class="gps-fallback">This example needs WebGL, which is unavailable here.</div>
    </div>
    <p class="gps-summary"></p>
    <dl class="gps-specs"></dl>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const stage = document.querySelector('.gps-stage');
const canvas = stage.querySelector('canvas');
const summary = document.querySelector('.gps-summary');
const specs = document.querySelector('.gps-specs');
const buttons = [...document.querySelectorAll('.gps-modes button')];

const modeCopy = {
    current: {
        summary:
            'How these blocks render today. Dark olive colours are lit about three times too bright, then flattened by filmic tone mapping. Every face is one flat colour because the edges are sharp.',
        specs: [
            ['Tone mapping', 'ACES filmic'],
            ['Light on a sunlit top', '≈ 3× albedo'],
            ['Edges', 'Sharp, 24-vertex boxes'],
            ['Surface', 'Flat colour, matte'],
        ],
    },
    code: {
        summary:
            'The same models with renderer changes only: a warm key and cool fill light, neutral tone mapping, a saturated colour remap, a height gradient and soft contact shadows.',
        specs: [
            ['Tone mapping', 'Khronos neutral'],
            ['Light on a sunlit top', '≈ 1× albedo'],
            ['Edges', 'Unchanged'],
            ['Surface', 'Flat colour, semi-gloss'],
        ],
    },
    party: {
        summary:
            'Reshaped assets on top of the renderer changes: one continuous floor with a bevelled soil rim, soft painted textures on soil, wood, bark and stone, rounded chunky shapes and idle motion. Hover a block, or click it to make it hop.',
        specs: [
            ['Tone mapping', 'Khronos neutral'],
            ['Light on a sunlit top', '≈ 1× albedo'],
            ['Edges', 'Bevel radius 0.04 to 0.07'],
            ['Surface', 'Painted, semi-gloss'],
        ],
    },
};

// Albedo and PBR factors per material role. `current` values are read from the
// exported GLBs; `party` values are the proposed sRGB albedo targets.
const palettes = {
    current: {
        grass: ['#687529', 1, 0.4],
        dirt: ['#462e22', 1, 0.6],
        islandSoil: ['#462e22', 1, 0.6],
        soil: ['#553929', 1, 0.6],
        wood: ['#7d4422', 0.78, 0],
        woodDark: ['#7d4422', 0.78, 0],
        trunk: ['#956247', 0.9, 0.5],
        leaves: ['#7a8930', 1, 0.2],
        leavesLight: ['#7a8930', 1, 0.2],
        bush: ['#7a8930', 1, 0.3],
        stone: ['#5d5d5d', 1, 0],
        metal: ['#555555', 0.5, 0],
        water: ['#3598e7', 0.2, 0.8],
        petal: ['#ffea50', 0.86, 0],
        petalShade: ['#fdce45', 0.86, 0],
        flowerCenter: ['#a27c4d', 0.86, 0],
        stem: ['#7a8930', 1, 0],
        cropLeaf: ['#7a8930', 1, 0],
        cropLeafLight: ['#b0bf8d', 1, 0],

        pebble: ['#5d5d5d', 1, 0],
    },
    party: {

let renderer;
try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch {
    stage.querySelector('.gps-fallback').style.display = 'grid';
}

if (renderer) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 200);
    const cameraTarget = new THREE.Vector3(0, 0.42, 0);
    // Same isometric direction as defaultGameCameraPosition [-100, 100, -100].
    camera.position.set(-40, 40.42, -40);
    camera.lookAt(cameraTarget);

    const controls = new OrbitControls(camera, canvas);
    controls.target.copy(cameraTarget);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(38);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(66);
    controls.update();

    const environmentMap = createSkyEnvironment(renderer);

    let mode = 'party';
    let world = null;
    let needsRender = true;
    let hovered = null;
    let visible = true;
    let elapsed = 0;
    let lastFrame = performance.now();

    controls.addEventListener('change', () => {
        needsRender = true;
    });

    // ---------------------------------------------------------------- lights
    function createSkyEnvironment(gl) {
        // A tiny gradient sky with one soft light source. It only has to give
        // semi-gloss surfaces something to reflect.
        const envScene = new THREE.Scene();
        const dome = new THREE.SphereGeometry(10, 32, 16);
        const top = new THREE.Color('#7cc8ff');
        const horizon = new THREE.Color('#fff3da');
        const ground = new THREE.Color('#8fcb62');
        const color = new THREE.Color();
        const colors = [];
        const position = dome.attributes.position;
        for (let i = 0; i < position.count; i++) {
            const height = position.getY(i) / 10;
            if (height >= 0) color.copy(horizon).lerp(top, height ** 0.6);
            else color.copy(horizon).lerp(ground, (-height) ** 0.5);
            colors.push(color.r, color.g, color.b);
        }
        dome.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        envScene.add(
            new THREE.Mesh(
                dome,
                new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide }),
            ),
        );
        const softbox = new THREE.Mesh(
            new THREE.SphereGeometry(2.4, 16, 12),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(7, 6.6, 6) }),
        );
        softbox.position.set(-3, 7.5, -5);
        envScene.add(softbox);
        const generator = new THREE.PMREMGenerator(gl);
        const texture = generator.fromScene(envScene, 0.035).texture;
        generator.dispose();
        return texture;
    }

    function addLights(root, style) {
        if (style === 'current') {
            // Midday values from useEnvironmentElements in Environment.tsx.
            root.add(new THREE.AmbientLight('#ffffff', 3));
            const hemisphere = new THREE.HemisphereLight(
                new THREE.Color().setRGB(0, 197 / 255, 1, THREE.SRGBColorSpace),
                new THREE.Color(0.002, 0.002, 0.002),
                5,
            );
            root.add(hemisphere);
            const sun = new THREE.DirectionalLight(
                new THREE.Color().setRGB(1, 246 / 255, 237 / 255, THREE.SRGBColorSpace),
                5,
            );
            sun.position.set(-5, 20, 2);
            configureShadow(sun, 2.2, 1);
            root.add(sun);
            return;
        }

        // Warm key from the upper left, a hemisphere fill (cool sky, warm
        // ground bounce) and a cool fill from the opposite side so shaded
        // faces stay blue instead of grey. No flat ambient light.
        root.add(new THREE.HemisphereLight('#c4e4ff', '#ffdcae', 1.55));
        const key = new THREE.DirectionalLight('#fff0d2', 2.55);
        key.position.set(5, 10, -6);
        configureShadow(key, 4.5, 0.82);
        root.add(key);
        const fill = new THREE.DirectionalLight('#a8d0ff', 0.75);
        fill.position.set(-6, 5, 3);
        root.add(fill);
    }

    function configureShadow(light, radius, intensity) {
        light.castShadow = true;
        light.shadow.mapSize.set(2048, 2048);
        light.shadow.radius = radius;
        light.shadow.intensity = intensity;
        light.shadow.normalBias = 0.03;
        light.shadow.bias = -0.0004;
        const shadowCamera = light.shadow.camera;
        shadowCamera.left = -6;
        shadowCamera.right = 6;
        shadowCamera.top = 6;
        shadowCamera.bottom = -6;
        shadowCamera.near = 0.5;
        shadowCamera.far = 50;
    }

    async function loadPaintedTextures() {
        const loader = new THREE.TextureLoader();
        const entries = await Promise.all(
            Object.entries(textureSources).map(async ([name, source]) => {
                const texture = await loader.loadAsync(source);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.anisotropy = 8;
                return [name, texture];
            }),
        );
        return Object.fromEntries(entries);
    }

    // Which ground type covers each point of the 5 x 5 island: white is path,
    // black is grass. The edge wobbles so the path does not follow the grid.
    function pathMaskTexture() {
        const size = 256;
        const surface = document.createElement('canvas');
        surface.width = size;
        surface.height = size;
        const context = surface.getContext('2d');
        context.fillStyle = '#000000';
        context.fillRect(0, 0, size, size);
        const toPixelX = (x) => ((x + 2.5) / 5) * size;
        const toPixelY = (z) => ((2.5 - z) / 5) * size;
        const leftEdge = (z) => -1.46 - 0.045 * Math.sin(z * 2.3 + 1) - 0.03 * Math.sin(z * 5.1 + 2.4);
        const rightEdge = (z) => -0.54 + 0.045 * Math.sin(z * 2.7 + 4) + 0.03 * Math.sin(z * 4.6 + 0.7);
        context.globalCompositeOperation = 'lighter';
        context.fillStyle = '#ffffff';
        for (const [grow, alpha] of [[0.07, 0.34], [0.035, 0.33], [0, 0.33]]) {
            context.globalAlpha = alpha;
            context.beginPath();
            for (let z = -2.7; z <= 2.7; z += 0.1) context.lineTo(toPixelX(leftEdge(z) - grow), toPixelY(z));
            for (let z = 2.7; z >= -2.7; z -= 0.1) context.lineTo(toPixelX(rightEdge(z) + grow), toPixelY(z));
            context.closePath();
            context.fill();
        }
        return new THREE.CanvasTexture(surface);
    }

    const textures = await loadPaintedTextures();
    textures.pathMask = pathMaskTexture();

    // Texture, repeats per world unit and tint for each textured role in the
    // party style. A tint darkens the shared wood texture for posts.
    const partyTextures = {
        wood: ['wood', 1.4, [1, 1, 1]],
        woodDark: ['wood', 1.4, [0.81, 0.61, 0.48]],
        trunk: ['bark', 1.6, [1, 1, 1]],
        stone: ['stone', 1.2, [1, 1, 1]],
        soil: ['soil', 1.2, [1, 1, 1]],
        islandSoil: ['terrain-soil', 0.6, [1, 1, 1]],
    };

    // ------------------------------------------------------------- materials
    // Three things flat colour cannot give under an orthographic camera:
    // a vertical gradient (cool and darker at the base, warm and lighter at
    // the top), a sky-coloured rim, and an optional painted texture. The
    // texture is projected from world axes, so it needs no UVs and stays
    // continuous across separate meshes such as terrain blocks.
    function applyToySurface(material, options) {
        const { base, height, rim, map = null, mapScale = 1, vertical = false, anchored = true, blend = null } = options;
        material.defines = { ...material.defines };
        if (map) material.defines.USE_TOY_MAP = '';
        if (vertical) material.defines.TOY_MAP_VERTICAL = '';
        if (blend) material.defines.USE_TOY_BLEND = '';
        material.onBeforeCompile = (shader) => {
            Object.assign(shader.uniforms, {
                uToyGradient: { value: new THREE.Vector2(base, height) },
                uToyShade: { value: new THREE.Vector3(0.66, 0.74, 0.98) },
                uToyTint: { value: new THREE.Vector3(1.06, 1.03, 0.93) },
                uToyRim: { value: rim },
                // 1 keeps the texture attached to a moving object, 0 leaves it
                // in world space so neighbouring terrain lines up.
                uToyAnchor: { value: anchored ? 1 : 0 },
                uToyMap: { value: map },
                uToyMapScale: { value: mapScale },
                uToyMap2: { value: blend?.map ?? null },
                uToyMask: { value: blend?.mask ?? null },
                uToyMaskRect: { value: new THREE.Vector4(...(blend?.rect ?? [0, 0, 1, 1])) },
            });
            shader.vertexShader = shader.vertexShader
                .replace(
                    '#include <common>',
                    [
                        '#include <common>',
                        'varying float vToyHeight;',
                        'varying vec3 vToyPosition;',
                        'varying vec3 vToyNormal;',
                        'uniform float uToyAnchor;',
                    ].join('\n'),
                )
                .replace(
                    '#include <begin_vertex>',
                    [
                        '#include <begin_vertex>',
                        'vec4 toyWorld = modelMatrix * vec4(transformed, 1.0);',
                        'vToyHeight = toyWorld.y;',
                        'vToyPosition = toyWorld.xyz - modelMatrix[3].xyz * uToyAnchor;',
                        'vToyNormal = mat3(modelMatrix) * objectNormal;',
                    ].join('\n'),
                );
            shader.fragmentShader = shader.fragmentShader
                .replace(
                    '#include <common>',
                    [
                        '#include <common>',
                        'varying float vToyHeight;',
                        'varying vec3 vToyPosition;',
                        'varying vec3 vToyNormal;',
                        'uniform vec2 uToyGradient;',
                        'uniform vec3 uToyShade;',
                        'uniform vec3 uToyTint;',
                        'uniform float uToyRim;',
                        '#ifdef USE_TOY_MAP',
                        'uniform sampler2D uToyMap;',
                        'uniform sampler2D uToyMap2;',
                        'uniform sampler2D uToyMask;',
                        'uniform float uToyMapScale;',
                        'uniform vec4 uToyMaskRect;',
                        'vec3 toyTriplanar(sampler2D source, vec3 position, vec3 weights) {',
                        '    #ifdef TOY_MAP_VERTICAL',
                        '        return texture2D(source, position.yz).rgb * weights.x',
                        '            + texture2D(source, position.zx).rgb * weights.y',
                        '            + texture2D(source, position.yx).rgb * weights.z;',
                        '    #else',
                        '        return texture2D(source, position.zy).rgb * weights.x',
                        '            + texture2D(source, position.xz).rgb * weights.y',
                        '            + texture2D(source, position.xy).rgb * weights.z;',
                        '    #endif',
                        '}',
                        '#endif',
                    ].join('\n'),
                )
                .replace(
                    '#include <color_fragment>',
                    [
                        '#include <color_fragment>',
                        '#ifdef USE_TOY_MAP',
                        '    vec3 toyWeights = pow(abs(normalize(vToyNormal)), vec3(4.0));',
                        '    toyWeights /= toyWeights.x + toyWeights.y + toyWeights.z;',
                        '    vec3 toyTexel = toyTriplanar(uToyMap, vToyPosition * uToyMapScale, toyWeights);',
                        '    #ifdef USE_TOY_BLEND',
                        '        vec3 toySecond = toyTriplanar(uToyMap2, vToyPosition * uToyMapScale, toyWeights);',
                        '        float toyMask = texture2D(uToyMask, (vToyPosition.xz - uToyMaskRect.xy) / uToyMaskRect.zw).r;',
                        '        toyTexel = mix(toyTexel, toySecond, smoothstep(0.3, 0.7, toyMask));',
                        '        // A slightly darker band where the two grounds meet.',
                        '        toyTexel *= 1.0 - 0.14 * (1.0 - abs(toyMask * 2.0 - 1.0));',
                        '    #endif',
                        '    diffuseColor.rgb *= toyTexel;',
                        '#endif',
                        'float toyRamp = clamp((vToyHeight - uToyGradient.x) / uToyGradient.y, 0.0, 1.0);',
                        'toyRamp = toyRamp * toyRamp * (3.0 - 2.0 * toyRamp);',
                        'diffuseColor.rgb *= mix(uToyShade, uToyTint, toyRamp);',
                    ].join('\n'),
                )
                .replace(
                    '#include <opaque_fragment>',
                    [
                        'float toyFacing = clamp(dot(normal, geometryViewDir), 0.0, 1.0);',
                        'float toyRim = pow(1.0 - toyFacing, 2.5) * smoothstep(-0.1, 0.7, normal.y);',
                        'outgoingLight += vec3(0.72, 0.9, 1.0) * (uToyRim * toyRim);',
                        '#include <opaque_fragment>',
                    ].join('\n'),
                );
        };
        const variant = [map ? 'map' : '', vertical ? 'vertical' : '', blend ? 'blend' : ''].join('-');
        material.customProgramCacheKey = () => `toy-surface-${variant}`;
    }

    function createMaterialFactory(style, disposables) {
        const palette = style === 'current' ? palettes.current : palettes.party;
        const cache = new Map();
        return (role, options = {}) => {
            const { base = 0, height = 1, flat = false, side = THREE.FrontSide, vertical = false } = options;
            const key = [role, base, height, flat, side, vertical].join('|');
            if (cache.has(key)) return cache.get(key);
            const [color, roughness, metalness] = palette[role];
            const painted = style === 'party' ? partyTextures[role] : undefined;
            const material = new THREE.MeshStandardMaterial({
                // A painted texture carries the colour itself; the material
                // colour is left as a tint.
                color: painted ? new THREE.Color().setRGB(...painted[2]) : color,
                roughness,
                metalness,
                flatShading: flat,
                side,
            });
            if (style !== 'current') {
                material.envMapIntensity = 1;
                applyToySurface(material, {
                    base,
                    height,
                    rim: style === 'party' ? 0.5 : 0.3,
                    map: painted ? textures[painted[0]] : null,
                    mapScale: painted ? painted[1] : 1,
                    vertical,
                });
            }
            cache.set(key, material);
            disposables.push(material);
            return material;
        };
    }

    function createBlobTexture() {
        const size = 128;
        const blob = document.createElement('canvas');
        blob.width = size;
        blob.height = size;
        const context = blob.getContext('2d');
        const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.55, 'rgba(255,255,255,0.55)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(blob);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
    }

    // ----------------------------------------------------------------- world
    function buildWorld(style) {
        const root = new THREE.Group();
        const disposables = [];
        const entities = [];
        const material = createMaterialFactory(style, disposables);
        const rounded = style === 'party';
        const styled = style !== 'current';

        const track = (geometry) => {
            disposables.push(geometry);
            return geometry;
        };
        const box = (w, h, d) => track(new THREE.BoxGeometry(w, h, d));
        const roundedBox = (w, h, d, radius, segments = 4) =>
            track(new RoundedBoxGeometry(w, h, d, segments, radius));
        const sphere = (radius, w = 24, h = 16) => track(new THREE.SphereGeometry(radius, w, h));
        const cylinder = (top, bottom, h, segments = 20, open = false) =>
            track(new THREE.CylinderGeometry(top, bottom, h, segments, 1, open));

        function mesh(parent, geometry, mat, position = [0, 0, 0], options = {}) {
            const item = new THREE.Mesh(geometry, mat);
            item.position.set(position[0], position[1], position[2]);
            if (options.scale) item.scale.set(...options.scale);
            if (options.rotation) item.rotation.set(...options.rotation);
            item.castShadow = options.cast ?? true;
            item.receiveShadow = options.receive ?? true;
            parent.add(item);
            return item;
        }

        function entity(x, z, build, options = {}) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            root.add(group);
            const state = {
                group,
                breatheNode: null,
                breathe: options.breathe ?? 0,
                sway: options.sway ?? 0,
                phase: (x * 1.7 + z * 2.3) % 6.28,
                pop: 1,
                popVelocity: 0,
                popTarget: 1,
                squash: 0,
                squashVelocity: 0,
                lift: 0,
                liftVelocity: 0,
                delay: 0,
            };
            group.userData.entity = state;
            build(group, state);
            entities.push(state);
            return state;
        }

        let blobMaterial = null;
        function contactShadow(parent, radiusX, radiusZ, y = 0.012, opacity = 0.34) {
            if (!styled) return;
            if (!blobMaterial) {
                const texture = createBlobTexture();
                disposables.push(texture);
                blobMaterial = new THREE.MeshBasicMaterial({
                    map: texture,
                    color: '#12402e',
                    transparent: true,
                    opacity: 1,
                    depthWrite: false,
                    toneMapped: false,
                });
                disposables.push(blobMaterial);
            }
            const mat = blobMaterial.clone();
            mat.opacity = opacity;
            disposables.push(mat);
            const plane = new THREE.Mesh(track(new THREE.PlaneGeometry(1, 1)), mat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = y;
            plane.scale.set(radiusX * 2, radiusZ * 2, 1);
            plane.renderOrder = 1;
            parent.add(plane);
        }

        addLights(root, style);

        // ---- terrain: 5 x 5 tiles, one soil path row at x = -1
        if (rounded) {
            // One continuous cap over a soil body. Only the outer rim is
            // bevelled, and the path is painted into the surface through a
            // mask, so no tile seams show. In the game, blocks stay separate
            // meshes: world-projected textures line up across them and only
            // exposed edges get the rounded rim.
            mesh(
                root,
                roundedBox(4.92, 0.46, 4.92, 0.15, 6),
                material('islandSoil', { base: -0.62, height: 0.5 }),
                [0, -0.37, 0],
            );
            const ground = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.74, metalness: 0 });
            ground.envMapIntensity = 1;
            applyToySurface(ground, {
                base: -0.3,
                height: 0.3,
                rim: 0.5,
                map: textures.grass,
                mapScale: 0.5,
                anchored: false,
                blend: { map: textures.path, mask: textures.pathMask, rect: [-2.5, -2.5, 5, 5] },
            });
            disposables.push(ground);
            mesh(root, roundedBox(5, 0.2, 5, 0.07, 6), ground, [0, -0.1, 0]);
        } else {
            // BlockGrass.glb and BlockGround.glb: 1 x 0.4 x 1 boxes, 24 vertices.
            const block = box(1, 0.4, 1);
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    const role = x === -1 ? 'dirt' : 'grass';
                    mesh(root, block, material(role, { base: -0.5, height: 0.5 }), [x, -0.2, z]);
                }
            }
        }

        // ---- raised bed: 1 x 2 tiles at x = 0, z = -1..0
        entity(0, -0.5, (group) => {
            if (rounded) {
                const board = material('wood', { base: -0.05, height: 0.5 });
                const post = material('woodDark', { base: -0.05, height: 0.6, vertical: true });
                const longPlank = roundedBox(0.12, 0.17, 1.74, 0.035);
                const shortPlank = roundedBox(0.74, 0.17, 0.12, 0.035);
                for (const level of [0.095, 0.285]) {
                    mesh(group, longPlank, board, [-0.41, level, 0]);
                    mesh(group, longPlank, board, [0.41, level, 0]);
                    mesh(group, shortPlank, board, [0, level, -0.91]);
                    mesh(group, shortPlank, board, [0, level, 0.91]);
                }
                const corner = roundedBox(0.19, 0.5, 0.19, 0.055);
                for (const [x, z] of [[-0.41, -0.91], [0.41, -0.91], [-0.41, 0.91], [0.41, 0.91]]) {
                    mesh(group, corner, post, [x, 0.25, z]);
                }
                mesh(
                    group,
                    roundedBox(0.72, 0.12, 1.72, 0.04),
                    material('soil', { base: -0.1, height: 0.4 }),
                    [0, 0.25, 0],
                );
                contactShadow(group, 0.78, 1.3, 0.012, 0.3);
            } else {
                // RaisedBed.glb: 0.08 thick planks, 0.3 tall, soil at 0.25.
                const planks = material('wood', { base: -0.05, height: 0.45 });
                mesh(group, box(0.08, 0.3, 2), planks, [-0.46, 0.15, 0]);
                mesh(group, box(0.08, 0.3, 2), planks, [0.46, 0.15, 0]);
                mesh(group, box(0.84, 0.3, 0.08), planks, [0, 0.15, -0.96]);
                mesh(group, box(0.84, 0.3, 0.08), planks, [0, 0.15, 0.96]);
                mesh(group, box(0.84, 0.25, 1.84), material('soil', { base: 0, height: 0.3 }), [0, 0.125, 0]);
                contactShadow(group, 0.7, 1.2, 0.012, 0.26);
            }
        });

        const soilTop = rounded ? 0.31 : 0.25;
        const cropSlots = [
            ['lettuce', 0.17, -1.17],
            ['carrot', -0.17, -1.2],
            ['tomato', 0.17, -0.7],
            ['lettuce', -0.17, -0.66],
            ['carrot', 0.17, -0.22],
            ['tomato', -0.17, -0.16],
            ['lettuce', 0.17, 0.24],
            ['sprout', -0.17, 0.28],
        ];
        for (const [kind, x, z] of cropSlots) {
            entity(x, z, (group, state) => {
                const plant = new THREE.Group();
                plant.position.y = soilTop;
                group.add(plant);
                state.breatheNode = plant;
                if (rounded) {
                    plant.scale.setScalar(1.3);
                    buildPartyCrop(plant, kind);
                } else {
                    buildCurrentCrop(plant, kind);
                }
            }, { breathe: 0.035 });
        }

        function buildPartyCrop(plant, kind) {
            const leaf = material('cropLeaf', { base: soilTop, height: 0.4 });
            const leafLight = material('cropLeafLight', { base: soilTop, height: 0.4 });
            const blob = sphere(1, 16, 12);
            if (kind === 'lettuce') {
                mesh(plant, blob, leafLight, [0, 0.07, 0], { scale: [0.075, 0.08, 0.075] });
                for (let i = 0; i < 7; i++) {
                    const angle = (i / 7) * Math.PI * 2;
                    const petal = mesh(plant, blob, i % 2 ? leaf : leafLight, [
                        Math.cos(angle) * 0.085,
                        0.05,
                        Math.sin(angle) * 0.085,
                    ], { scale: [0.085, 0.03, 0.065] });
                    petal.rotation.set(0, -angle, 0.5, 'YXZ');
                }
            } else if (kind === 'carrot') {
                mesh(plant, blob, material('carrot', { base: soilTop, height: 0.2 }), [0, 0.012, 0], {
                    scale: [0.05, 0.035, 0.05],
                });
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const frond = mesh(plant, blob, i % 2 ? leaf : leafLight, [
                        Math.cos(angle) * 0.045,
                        0.12,
                        Math.sin(angle) * 0.045,
                    ], { scale: [0.028, 0.11, 0.028] });
                    frond.rotation.set(0, -angle, -0.38, 'YXZ');
                }
            } else if (kind === 'tomato') {
                mesh(plant, cylinder(0.014, 0.014, 0.5, 10), material('woodDark', { base: soilTop, height: 0.5, vertical: true }), [0.05, 0.25, 0.03]);
                mesh(plant, blob, leaf, [0, 0.12, 0], { scale: [0.11, 0.1, 0.11] });
                mesh(plant, blob, leafLight, [0.02, 0.25, -0.01], { scale: [0.095, 0.09, 0.095] });
                mesh(plant, blob, leaf, [-0.01, 0.36, 0.01], { scale: [0.075, 0.075, 0.075] });
                const fruit = material('tomato', { base: soilTop, height: 0.5 });
                for (const [x, y, z, size] of [[-0.09, 0.13, -0.05, 0.052], [-0.05, 0.25, -0.09, 0.046], [-0.1, 0.3, 0.02, 0.04]]) {
                    mesh(plant, blob, fruit, [x, y, z], { scale: [size, size, size] });
                }
            } else {
                mesh(plant, cylinder(0.014, 0.018, 0.1, 10), leaf, [0, 0.05, 0]);
                for (const direction of [-1, 1]) {
                    const seedLeaf = mesh(plant, blob, leafLight, [direction * 0.05, 0.11, 0], {
                        scale: [0.055, 0.016, 0.036],
                    });
                    seedLeaf.rotation.z = direction * 0.45;
                }
            }
        }

        function buildCurrentCrop(plant, kind) {
            const leaf = material('cropLeaf', { base: soilTop, height: 0.4, side: THREE.DoubleSide });
            const leafLight = material('cropLeafLight', { base: soilTop, height: 0.4, side: THREE.DoubleSide });
            const stalkHeight = kind === 'tomato' ? 0.36 : kind === 'sprout' ? 0.08 : 0.16;
            mesh(plant, cylinder(0.008, 0.01, stalkHeight, 5), material('stem', { base: soilTop, height: 0.4 }), [0, stalkHeight / 2, 0]);
            const blade = track(new THREE.PlaneGeometry(0.1, 0.05));
            const count = kind === 'sprout' ? 2 : kind === 'tomato' ? 7 : 5;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + 0.4;
                const y = stalkHeight * (0.35 + (0.65 * i) / count);
                const item = mesh(plant, blade, i % 2 ? leaf : leafLight, [
                    Math.cos(angle) * 0.05,
                    y,
                    Math.sin(angle) * 0.05,
                ]);
                item.rotation.set(-0.5, -angle, 0, 'YXZ');
            }
            if (kind === 'tomato') {
                const fruit = track(new THREE.IcosahedronGeometry(0.028, 0));
                mesh(plant, fruit, material('tomato', { base: soilTop, height: 0.4, flat: true }), [-0.04, 0.17, -0.03]);
                mesh(plant, fruit, material('tomato', { base: soilTop, height: 0.4, flat: true }), [-0.03, 0.26, 0.03]);
            }
        }

        // ---- tree
        entity(2, 2, (group, state) => {
            if (rounded) {
                mesh(group, cylinder(0.12, 0.19, 0.72, 20), material('trunk', { base: 0, height: 0.8, vertical: true }), [0, 0.36, 0]);
                const canopy = new THREE.Group();
                canopy.position.y = 0.6;
                group.add(canopy);
                state.breatheNode = canopy;
                // One soft dome with a flat underside and a lighter cap on
                // the side facing the camera, instead of a cluster of spheres.
                const leaves = material('leaves', { base: 0.55, height: 1.25 });
                const leavesLight = material('leavesLight', { base: 0.55, height: 1.25 });
                const dome = track(new THREE.SphereGeometry(1, 40, 28));
                const domePosition = dome.attributes.position;
                for (let i = 0; i < domePosition.count; i++) {
                    // The canopy sits on the trunk like a cap.
                    if (domePosition.getY(i) < -0.69) domePosition.setY(i, -0.69);
                }
                dome.computeVertexNormals();
                mesh(canopy, dome, leaves, [0, 0.7, 0], { scale: [0.66, 0.58, 0.66] });
                const puff = sphere(1, 28, 20);
                mesh(canopy, puff, leavesLight, [-0.14, 1.04, -0.1], { scale: [0.4, 0.24, 0.4] });
                const apple = material('tomato', { base: 0.6, height: 1.2 });
                for (const [x, y, z] of [[-0.53, 0.7, -0.39], [-0.23, 0.56, -0.6], [-0.64, 0.61, 0.13], [-0.41, 0.97, -0.41], [0.13, 0.76, -0.64]]) {
                    mesh(canopy, puff, apple, [x, y, z], { scale: [0.07, 0.07, 0.07] });
                }
                contactShadow(group, 0.62, 0.62, 0.012, 0.36);
            } else {
                // Tree.glb: 1.0 tall six-sided trunk, 1.4 wide faceted canopy.
                mesh(group, cylinder(0.07, 0.1, 1, 6), material('trunk', { base: 0, height: 1, flat: true }), [0, 0.5, 0]);
                mesh(
                    group,
                    track(new THREE.IcosahedronGeometry(0.7, 1)),
                    material('leaves', { base: 0.45, height: 1.45, flat: true }),
                    [0, 1.15, 0],
                );
                contactShadow(group, 0.5, 0.5, 0.012, 0.3);
            }
        }, { breathe: 0.022 });

        // ---- bush
        entity(2, 0.1, (group, state) => {
            if (rounded) {
                const shrub = new THREE.Group();
                group.add(shrub);
                state.breatheNode = shrub;
                const leaves = material('bush', { base: 0, height: 0.6 });
                const leavesLight = material('leavesLight', { base: 0, height: 0.6 });
                const puff = sphere(1, 24, 16);
                mesh(shrub, puff, leaves, [0, 0.24, 0], { scale: [0.33, 0.29, 0.33] });
                mesh(shrub, puff, leavesLight, [-0.2, 0.19, -0.15], { scale: [0.23, 0.2, 0.23] });
                mesh(shrub, puff, leaves, [0.19, 0.17, 0.17], { scale: [0.22, 0.19, 0.22] });
                const blossom = material('blossom', { base: 0, height: 0.6 });
                const heart = material('petal', { base: 0, height: 0.6 });
                for (const [x, y, z] of [[-0.3, 0.33, -0.25], [-0.12, 0.47, -0.2], [-0.33, 0.24, 0.02], [0.02, 0.4, -0.3]]) {
                    mesh(shrub, puff, blossom, [x, y, z], { scale: [0.045, 0.045, 0.045] });
                    mesh(shrub, puff, heart, [x - 0.025, y + 0.02, z - 0.025], { scale: [0.022, 0.022, 0.022] });
                }
                contactShadow(group, 0.45, 0.45, 0.012, 0.34);
            } else {
                // Bush.glb: 0.5 wide, 0.25 tall low-poly mound.
                mesh(
                    group,
                    track(new THREE.IcosahedronGeometry(0.27, 0)),
                    material('bush', { base: 0, height: 0.3, flat: true }),
                    [0, 0.12, 0],
                    { scale: [1, 0.55, 1] },
                );
                contactShadow(group, 0.33, 0.33, 0.012, 0.26);
            }
        }, { breathe: 0.03 });

        // ---- stones
        function pebbleGeometry(radius, seed) {
            let geometry = new THREE.IcosahedronGeometry(radius, 4);
            geometry.deleteAttribute('normal');
            geometry.deleteAttribute('uv');
            geometry = mergeVertices(geometry);
            const position = geometry.attributes.position;
            const point = new THREE.Vector3();
            for (let i = 0; i < position.count; i++) {
                point.fromBufferAttribute(position, i).normalize();
                const bump =
                    1 +
                    0.1 * Math.sin(point.x * 3.1 + seed) * Math.sin(point.y * 2.7 + seed * 1.7) +
                    0.07 * Math.sin(point.z * 4.3 + seed * 0.6);
                point.multiplyScalar(radius * bump);
                position.setXYZ(i, point.x, point.y, point.z);
            }
            geometry.computeVertexNormals();
            return track(geometry);
        }
        for (const [x, z, size, seed] of [[2, -1.95, 1, 1.3], [1.5, -2.15, 0.55, 4.1]]) {
            entity(x, z, (group) => {
                if (rounded) {
                    mesh(group, pebbleGeometry(0.3 * size, seed), material('stone', { base: 0, height: 0.4 * size }), [0, 0.15 * size, 0], {
                        scale: [1.15, 0.72, 1],
                    });
                    contactShadow(group, 0.42 * size, 0.38 * size, 0.012, 0.36);
                } else {
                    // StoneMedium.glb: 0.65 x 0.32 x 0.62 faceted rock.
                    mesh(
                        group,
                        track(new THREE.DodecahedronGeometry(0.32 * size, 0)),
                        material('stone', { base: 0, height: 0.35 * size, flat: true }),
                        [0, 0.13 * size, 0],
                        { scale: [1.02, 0.52, 0.97] },
                    );
                    contactShadow(group, 0.36 * size, 0.34 * size, 0.012, 0.26);
                }
            });
        }

        // ---- fence along the back-right edge
        entity(-1, 2.38, (group) => {
            const span = 0.95;
            const posts = [-1.425, -0.475, 0.475, 1.425];
            if (rounded) {
                const postMaterial = material('woodDark', { base: 0, height: 0.75, vertical: true });
                const railMaterial = material('wood', { base: 0, height: 0.75 });
                const post = roundedBox(0.19, 0.66, 0.19, 0.075, 5);
                const rail = roundedBox(span, 0.1, 0.085, 0.035);
                for (const x of posts) mesh(group, post, postMaterial, [x, 0.33, 0]);
                for (let i = 0; i < posts.length - 1; i++) {
                    const x = (posts[i] + posts[i + 1]) / 2;
                    mesh(group, rail, railMaterial, [x, 0.21, 0]);
                    mesh(group, rail, railMaterial, [x, 0.45, 0]);
                }
            } else {
                // Fence.glb: 0.16 square posts, 0.55 tall, thin rails.
                const planks = material('wood', { base: 0, height: 0.6 });
                const post = box(0.16, 0.55, 0.16);
                const rail = box(span, 0.08, 0.05);
                for (const x of posts) mesh(group, post, planks, [x, 0.275, 0]);
                for (let i = 0; i < posts.length - 1; i++) {
                    const x = (posts[i] + posts[i + 1]) / 2;
                    mesh(group, rail, planks, [x, 0.2, 0]);
                    mesh(group, rail, planks, [x, 0.4, 0]);
                }
            }
        });

        // ---- sunflowers
        for (const [x, z, scale] of [[-2, 1.55, 1], [-2.05, 0.6, 0.78]]) {
            entity(x, z, (group, state) => {
                const flower = new THREE.Group();
                flower.scale.setScalar(scale);
                group.add(flower);
                state.breatheNode = flower;
                const head = new THREE.Group();
                head.rotation.set(-0.32, -Math.PI * 0.75, 0, 'YXZ');
                flower.add(head);
                if (rounded) {
                    head.position.y = 0.86;
                    const stem = material('stem', { base: 0, height: 0.9 });
                    mesh(flower, cylinder(0.04, 0.05, 0.84, 14), stem, [0, 0.42, 0]);
                    const blob = sphere(1, 16, 12);
                    const leafMaterial = material('cropLeaf', { base: 0, height: 0.9 });
                    for (const [direction, y] of [[-1, 0.3], [1, 0.47]]) {
                        const leaf = mesh(flower, blob, leafMaterial, [direction * 0.14, y + 0.05, direction * 0.05], {
                            scale: [0.15, 0.028, 0.09],
                        });
                        leaf.rotation.set(0, 0.5, direction * 0.42, 'YXZ');
                    }
                    const petal = material('petal', { base: 0.4, height: 0.8 });
                    const petalShade = material('petalShade', { base: 0.4, height: 0.8 });
                    for (let i = 0; i < 14; i++) {
                        const angle = (i / 14) * Math.PI * 2;
                        const item = mesh(head, blob, i % 2 ? petalShade : petal, [
                            Math.cos(angle) * 0.2,
                            Math.sin(angle) * 0.2,
                            i % 2 ? -0.012 : 0.008,
                        ], { scale: [0.062, 0.125, 0.026] });
                        item.rotation.z = angle - Math.PI / 2;
                    }
                    mesh(head, blob, material('flowerCenter', { base: 0.4, height: 0.8 }), [0, 0, 0.02], {
                        scale: [0.155, 0.155, 0.07],
                    });
                    mesh(head, blob, stem, [0, 0, -0.04], { scale: [0.17, 0.17, 0.05] });
                    contactShadow(group, 0.2 * scale, 0.2 * scale, 0.012, 0.3);
                } else {
                    // Sunflower.glb: thin stem, flat petals around a flat disc.
                    head.position.y = 0.8;
                    const stem = material('stem', { base: 0, height: 0.9 });
                    mesh(flower, cylinder(0.02, 0.02, 0.8, 6), stem, [0, 0.4, 0]);
                    const leafMaterial = material('cropLeafLight', { base: 0, height: 0.9, side: THREE.DoubleSide });
                    const leafShape = track(new THREE.PlaneGeometry(0.26, 0.11));
                    for (const [direction, y] of [[-1, 0.32], [1, 0.48]]) {
                        const leaf = mesh(flower, leafShape, leafMaterial, [direction * 0.13, y, 0]);
                        leaf.rotation.set(-1.2, 0.5, 0, 'YXZ');
                    }
                    const petalShape = box(0.07, 0.17, 0.012);
                    const petal = material('petal', { base: 0.4, height: 0.8 });
                    const petalShade = material('petalShade', { base: 0.4, height: 0.8 });
                    for (let i = 0; i < 14; i++) {
                        const angle = (i / 14) * Math.PI * 2;
                        const item = mesh(head, petalShape, i % 2 ? petalShade : petal, [
                            Math.cos(angle) * 0.19,
                            Math.sin(angle) * 0.19,
                            0,
                        ]);
                        item.rotation.z = angle - Math.PI / 2;
                    }
                    const disc = mesh(head, cylinder(0.13, 0.13, 0.03, 12), material('flowerCenter', { base: 0.4, height: 0.8 }), [0, 0, 0.012]);
                    disc.rotation.x = Math.PI / 2;
                    contactShadow(group, 0.14 * scale, 0.14 * scale, 0.012, 0.22);
                }
            }, { breathe: 0.02, sway: 0.05 });
        }

        // ---- bucket
        entity(1, -1.05, (group) => {
            if (rounded) {
                const steel = material('metal', { base: 0, height: 0.42, side: THREE.DoubleSide });
                mesh(group, cylinder(0.245, 0.185, 0.36, 32, true), steel, [0, 0.18, 0]);
                mesh(group, track(new THREE.CircleGeometry(0.185, 32)), steel, [0, 0.004, 0], {
                    rotation: [Math.PI / 2, 0, 0],
                    cast: false,
                });
                mesh(group, track(new THREE.TorusGeometry(0.245, 0.03, 12, 36)), steel, [0, 0.36, 0], {
                    rotation: [Math.PI / 2, 0, 0],
                });
                mesh(group, track(new THREE.CircleGeometry(0.225, 32)), material('water', { base: 0, height: 0.4 }), [0, 0.3, 0], {
                    rotation: [-Math.PI / 2, 0, 0],
                    cast: false,
                });
                const handle = mesh(group, track(new THREE.TorusGeometry(0.245, 0.017, 10, 28, Math.PI)), steel, [0, 0.36, 0]);
                handle.rotation.set(0.5, 0.6, 0, 'YXZ');
                const grip = mesh(group, track(new THREE.CapsuleGeometry(0.03, 0.09, 6, 12)), material('wood', { base: 0.3, height: 0.4 }), [0, 0.215, 0]);
                grip.rotation.z = Math.PI / 2;
                handle.add(grip);
                grip.position.set(0, 0.245, 0);
                contactShadow(group, 0.34, 0.34, 0.012, 0.36);
            } else {
                // Bucket.glb: grey ten-sided pail with a thin handle.
                const steel = material('metal', { base: 0, height: 0.35, side: THREE.DoubleSide });
                mesh(group, cylinder(0.2, 0.16, 0.3, 10, true), steel, [0, 0.15, 0]);
                mesh(group, track(new THREE.CircleGeometry(0.19, 10)), material('water', { base: 0, height: 0.4 }), [0, 0.26, 0], {
                    rotation: [-Math.PI / 2, 0, 0],
                    cast: false,
                });
                const handle = mesh(group, track(new THREE.TorusGeometry(0.2, 0.008, 4, 10, Math.PI)), steel, [0, 0.3, 0]);
                handle.rotation.set(0.5, 0.6, 0, 'YXZ');
                contactShadow(group, 0.27, 0.27, 0.012, 0.26);
            }
        });

        // ---- small ground detail, party style only
        if (rounded) {
            const blob = sphere(1, 12, 8);
            const tuftMaterial = material('leavesLight', { base: 0, height: 0.2 });
            for (const [x, z] of [[1.25, 0.9], [0.75, 1.75], [1.6, -0.55], [-2.3, -1.4], [-0.1, 1.5], [0.8, -2.1], [-1.9, -0.45]]) {
                for (const [dx, dz, tilt, size] of [[0, 0, 0, 1], [0.05, 0.02, 0.5, 0.8], [-0.05, 0.02, -0.5, 0.75]]) {
                    const tuft = mesh(root, blob, tuftMaterial, [x + dx, 0.07 * size, z + dz], {
                        scale: [0.026, 0.08 * size, 0.026],
                        cast: false,
                    });
                    tuft.rotation.z = tilt;
                }
            }
            const pebble = material('pebble', { base: 0, height: 0.1 });
            for (const [x, z, size] of [[-1.2, -1.7, 0.07], [-0.78, -0.9, 0.05], [-1.22, 0.35, 0.06], [-0.8, 1.3, 0.075], [-1.15, 1.95, 0.045]]) {
                mesh(root, blob, pebble, [x, 0.012, z], { scale: [size, size * 0.45, size * 0.85] });
            }
        }

        return {
            root,
            entities,
            dispose() {
                for (const item of disposables) item.dispose();
            },
        };
    }

    // ----------------------------------------------------------- mode switch
    function setMode(next, animate) {
        mode = next;
        if (world) {
            scene.remove(world.root);
            world.dispose();
        }
        world = buildWorld(mode);
        scene.add(world.root);
        hovered = null;

        const styled = mode !== 'current';
        renderer.toneMapping = styled ? THREE.NeutralToneMapping : THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        scene.environment = styled ? environmentMap : null;
        scene.environmentIntensity = mode === 'party' ? 0.42 : 0.3;

        if (animate && mode === 'party') {
            for (const item of world.entities) {
                item.pop = 0.4;
                item.delay =
                    0.03 * (Math.abs(item.group.position.x + 2.5) + Math.abs(item.group.position.z + 2.5));
            }
        }

        stage.dataset.mode = mode;
        for (const button of buttons) {
            button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
        }
        const copy = modeCopy[mode];
        summary.textContent = copy.summary;
        specs.replaceChildren(
            ...copy.specs.map(([term, value]) => {
                const row = document.createElement('div');
                const dt = document.createElement('dt');
                const dd = document.createElement('dd');
                dt.textContent = term;
                dd.textContent = value;
                row.append(dt, dd);
                return row;
            }),
        );
        needsRender = true;
    }

    // ------------------------------------------------------------ interaction
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    function entityAt(event) {
        const bounds = canvas.getBoundingClientRect();
        pointer.set(
            ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
            -((event.clientY - bounds.top) / bounds.height) * 2 + 1,
        );
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(world.entities.map((item) => item.group), true)[0];
        let node = hit?.object ?? null;
        while (node && !node.userData.entity) node = node.parent;
        return node?.userData.entity ?? null;
    }

    canvas.addEventListener('pointermove', (event) => {
        if (mode !== 'party' || pointerDown) return;
        const next = entityAt(event);
        if (next === hovered) return;
        if (hovered) hovered.popTarget = 1;
        hovered = next;
        if (hovered) hovered.popTarget = 1.09;
    });
    canvas.addEventListener('pointerleave', () => {
        if (hovered) hovered.popTarget = 1;
        hovered = null;
    });
    canvas.addEventListener('pointerdown', (event) => {
        pointerDown = { x: event.clientX, y: event.clientY };
    });
    canvas.addEventListener('pointerup', (event) => {
        const start = pointerDown;
        pointerDown = null;
        if (mode !== 'party' || !start) return;
        if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 5) return;
        const target = entityAt(event);
        if (!target || target.lift > 0.001) return;
        target.liftVelocity = 2.4;
        target.squashVelocity = 3.2;
    });

    // ---------------------------------------------------------------- frame
    function animate(time, delta) {
        let moving = false;
        for (const item of world.entities) {
            if (item.delay > 0) {
                item.delay -= delta;
                item.group.scale.setScalar(0.4);
                moving = true;
                continue;
            }
            item.popVelocity += (-210 * (item.pop - item.popTarget) - 13 * item.popVelocity) * delta;
            item.pop += item.popVelocity * delta;
            item.squashVelocity += (-260 * item.squash - 11 * item.squashVelocity) * delta;
            item.squash += item.squashVelocity * delta;
            if (item.lift > 0 || item.liftVelocity > 0) {
                item.liftVelocity -= 11 * delta;
                item.lift += item.liftVelocity * delta;
                if (item.lift <= 0) {
                    item.lift = 0;
                    item.liftVelocity = 0;
                    item.squashVelocity = -3.4;
                }
            }
            item.group.position.y = item.lift;
            item.group.scale.set(
                item.pop * (1 - item.squash * 0.5),
                item.pop * (1 + item.squash),
                item.pop * (1 - item.squash * 0.5),
            );
            if (item.breatheNode) {
                const breath = item.breathe * Math.sin(time * 1.7 + item.phase);
                item.breatheNode.scale.set(1 - breath * 0.5, 1 + breath, 1 - breath * 0.5);
                item.breatheNode.rotation.z = item.sway * Math.sin(time * 1.1 + item.phase);
            }
            moving = true;
        }
        return moving;
    }

    function resize() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        if (!width || !height) return;
        renderer.setSize(width, height, false);
        const zoom = Math.min(width / 7.9, height / 6.3);
        camera.left = -width / 2 / zoom;
        camera.right = width / 2 / zoom;
        camera.top = height / 2 / zoom;
        camera.bottom = -height / 2 / zoom;
        camera.updateProjectionMatrix();
        needsRender = true;
    }

    function frame() {
        requestAnimationFrame(frame);
        const now = performance.now();
        const delta = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        if (!visible) return;
        elapsed += delta;
        const moving = mode === 'party' && animate(elapsed, delta);
        if (!moving && !needsRender) return;
        needsRender = false;
        renderer.render(scene, camera);
        window.__gpsReady = true;
    }

    new ResizeObserver(resize).observe(stage);
    new IntersectionObserver((entries) => {
        visible = entries.some((entry) => entry.isIntersecting);
        needsRender = true;
    }).observe(stage);

    for (const button of buttons) {
        button.addEventListener('click', () => setMode(button.dataset.mode, true));
    }

    const requested = new URLSearchParams(window.location.search).get('mode');
    setMode(requested in modeCopy ? requested : 'party', false);
    resize();
    frame();
}
</script>
</body>
</html>
