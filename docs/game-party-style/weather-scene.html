<title>Gredice Weather Target</title>
<!--
    Weather visual target for GAME_ART.md "Weather" and docs/game-party-style.md.
    Built on a copy of docs/game-party-style/example-scene.html (party mode only:
    the same island, lights, painted textures and toy surface shader). It is a
    standalone three.js page, not game runtime code. The source is the
    "soft diorama" exploration with the grafts the judges chose from "icon toys".
    Revised 2026-11-24 after user feedback: misty, varied clouds only in a band
    across the top of the view, one continuous deck from cover 0.8, a faint
    top haze, and slim, realistic raindrops (GAME_ART.md "Clouds and overcast",
    "Rain and heavy rain").

    Query parameters:
      weather = clear | cloudy | overcast | rain | heavyrain | storm | snow | fog | windy
      time    = midday | sunset | night
      wind    = 0..4 (API wind class, overrides the preset)
      seed    = integer, seeds every random layout
      t       = seconds; freezes all animation at that moment (storm strikes at
                t = 1.5, then every 7 to 11 s; see window.__weather.strikes)
      rm=1    = reduced motion
      quality = low | medium | high
      zoom    = pixels per world unit (the game's default is 100, far 75)
      shot=1  = full-viewport stage without controls (zoom 100 px per unit)
      debug=1 = draw call / triangle readout and the garden footprint
      hide=particles = hide rain, snow, splashes and wind (for flash checks)
      mask=1        = the garden alone on flat magenta (coverage checks)
      cs=0          = no cloud shadows; lightning=0 = no strikes; clouds=0 = no cloud band;
                      haze=0 = no cloud haze (for measurements)
-->
<style>
    :root { color-scheme: light; }
    body { margin: 16px; background: #ffffff; }

        color: var(--foreground, #1d2420);
        font-size: 14px;
        line-height: 1.45;
    }
    .gps-modes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }

        color: var(--muted-foreground, #5d6a60);
        min-width: 64px;
    }
    .gps-modes button {
        font: inherit;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--border, #cfd6cc);
        background: transparent;
        color: inherit;
        cursor: pointer;
    }
    .gps-modes button[aria-pressed='true'] {
        background: var(--primary, #2f7d32);
        border-color: var(--primary, #2f7d32);
        color: var(--primary-foreground, #ffffff);
    }
    .gps-modes button:focus-visible,
    .gps-modes input:focus-visible {
        outline: 2px solid var(--ring, #2f7d32);
        outline-offset: 2px;
    }
    .gps-modes input[type='range'] { width: 160px; }
    .gps-stage {
        position: relative;
        height: 560px;
        border-radius: var(--radius, 12px);
        overflow: hidden;
        background: #8fd8ff;
    }
    .gps-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
    }
    .gps-stage canvas:active { cursor: grabbing; }
    .gps-fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: #1d2420;
    }
    .gps-debug {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #1d2420;
        white-space: pre;
        display: none;
    }
    .gps-summary { margin: 0; min-height: 4.35em; }
    .gps-specs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px 16px;
        margin: 0;
    }
    .gps-specs div { border-top: 1px solid var(--border, #cfd6cc); padding-top: 6px; }
    .gps-specs dt { font-size: 12px; color: var(--muted-foreground, #5d6a60); }
    .gps-specs dd { margin: 0; font-weight: 600; }
    @media (max-width: 640px) {
        body { margin: 16px; }
        .gps-stage { height: 420px; }
    }
    html.shot body { margin: 0; }
    html.shot .gps { gap: 0; }
    html.shot .gps-modes,
    html.shot .gps-summary,
    html.shot .gps-specs { display: none; }
    html.shot .gps-stage { height: 100vh; border-radius: 0; }
</style>

<script type="module">
import * as THREE from 'three';

import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ------------------------------------------------------------------ params
const params = new URLSearchParams(window.location.search);
const shotMode = params.has('shot');
if (shotMode) document.documentElement.classList.add('shot');
const seed = Math.max(1, Math.floor(Number(params.get('seed') ?? 1)) || 1);
const frozenTime = params.has('t') ? Number(params.get('t')) : null;
const quality = ['low', 'medium', 'high'].includes(params.get('quality')) ? params.get('quality') : 'high';
// Pixels per world unit. null = fit the island (about 100 on a desktop stage).
let zoomParam = params.has('zoom') ? Number(params.get('zoom')) : shotMode ? 100 : null;
const debug = params.has('debug');
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = document.querySelector('.gps-stage');
if (params.get('mask') === '1') stage.style.background = '#ff00ff';
const canvas = stage.querySelector('canvas');
const summary = document.querySelector('.gps-summary');
const specs = document.querySelector('.gps-specs');
const debugBox = stage.querySelector('.gps-debug');
if (debug) debugBox.style.display = 'block';

function mulberry32(a) {
    return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smoothstep = (a, b, x) => {
    const t = clamp01((x - a) / (b - a));
    return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
// Unlit weather shaders write sRGB straight to the canvas, so their colours
// stay in sRGB. Lit (MeshStandard) uniforms use THREE.Color, which is linear.
const srgb = (hex) => {
    const c = new THREE.Color();
    c.setStyle(hex, THREE.SRGBColorSpace);
    const out = { r: 0, g: 0, b: 0 };
    c.getRGB(out, THREE.SRGBColorSpace);
    return new THREE.Vector3(out.r, out.g, out.b);
};
const mixV = (a, b, t) => a.clone().lerp(b, t);

// ------------------------------------------------------------ weather data
// Intensities follow the game's model (0..1 cloudy, rainy, snowy, foggy,
// discrete thundery, wind class 0..4) so presets map onto API data.
const WEATHER = {
    clear: { label: 'Clear', cloud: 0, rain: 0, snow: 0, fog: 0, thunder: 0, wind: 0.6, cover: 0 },
    cloudy: { label: 'Partly cloudy', cloud: 0.4, rain: 0, snow: 0, fog: 0, thunder: 0, wind: 1, cover: 0 },
    overcast: { label: 'Overcast', cloud: 0.92, rain: 0, snow: 0, fog: 0.06, thunder: 0, wind: 1.2, cover: 0 },
    rain: { label: 'Rain', cloud: 0.85, rain: 0.6, snow: 0, fog: 0.08, thunder: 0, wind: 1, cover: 0 },
    heavyrain: { label: 'Heavy rain', cloud: 1, rain: 1, snow: 0, fog: 0.12, thunder: 0, wind: 2, cover: 0 },
    storm: { label: 'Storm', cloud: 1, rain: 1, snow: 0, fog: 0.15, thunder: 1, wind: 3, cover: 0 },
    snow: { label: 'Snow', cloud: 0.75, rain: 0, snow: 0.8, fog: 0.05, thunder: 0, wind: 0.8, cover: 1 },
    fog: { label: 'Fog', cloud: 0.2, rain: 0, snow: 0, fog: 1, thunder: 0, wind: 0.5, cover: 0 },
    windy: { label: 'Windy', cloud: 0.3, rain: 0, snow: 0, fog: 0, thunder: 0, wind: 3.5, cover: 0 },
};
// Garden-safe screen rules shared by every sky prop (clouds, mist rolls in
// the sky, wind swooshes, the bolt): sizes are in pixels, so they do not grow
// when the camera zooms in, and a prop never overlaps the garden footprint.
const SKY = {
    marginPx: 14,
    bandVisible: 0.42, // share of a band cloud's height that shows below the top edge
    bandMaxShare: 0.1, // a band cloud covers at most this share of the view height
    boltPx: 150, // bolt height on screen
    boltBandPx: 96, // bolt height when it hangs from the top band
};

// Per time of day: the example scene's midday rig, plus sunset and night
// versions that follow gameArtStyle.ts (warm gold/coral sunset, light
// blue-violet night with the key at about half of midday).
const TIMES = {

        skyFog: ['#a2c0f4', '#c9d8fa', '#f1efff'],
        hemi: ['#c4e4ff', '#ffdcae', 1.55],
        key: ['#fff0d2', 2.55, [5, 10, -6]],
        fill: ['#a8d0ff', 0.75],
        env: 0.42,
        body: { kind: 'sun', pos: [0.1, 0.86], size: 0.048, color: '#fff3c2', glow: '#ffe9a6' },
        stars: 0,
        // Cloud body per weather: [lit top, shaded underside]. Unlit roles.
        cloud: {
            fair: ['#f8f6ff', '#c4cbf5'],
            overcast: ['#eceafd', '#a6acec'],
            rain: ['#e4e6fd', '#9ca6ea'],
            storm: ['#ddd6fb', '#968ce2'],

        },

    },

        stars: 0,

        },

        flakeCore: '#fff8f4',
        flakeEdge: '#d2bfee',
        hero: ['#9cd4fa', '#6a9cee', '#f4f0ff'],

    },
    night: {

        sky: ['#4a50bf', '#5e64d0', '#8682df'],

        skySnow: ['#5c66c8', '#737ed6', '#a0a3e6'],

        hemi: ['#b4b8f6', '#8a9cec', 1.5],

        fill: ['#96a2ff', 0.95],
        env: 0.14,
        body: { kind: 'moon', pos: [0.12, 0.86], size: 0.045, color: '#f6eed8', glow: '#b8b6f4' },
        stars: 1,
        cloud: {
            fair: ['#cbcaf8', '#8f92de'],
            overcast: ['#c6c2f4', '#8a86d8'],
            rain: ['#c0c0f4', '#8488da'],
            storm: ['#bcb2f2', '#7e72d2'],
            snow: ['#d4d6fa', '#9aa2e6'],

        },
        shadowTint: '#c2c4f6',
        shadow: 0.5,
        mist: '#b2b0f0',
        mistLow: '#9796e2',
        rainHead: '#e0f2ff',
        rainTail: '#a8dcff',
        ring: '#e4f2ff',

        puddle: ['#7d84e4', '#c6ccff'],
        flakeCore: '#f2f3ff',
        flakeEdge: '#a6b0f0',

        swoosh: '#dcdeff',

        snowCover: '#dfe3fb',
    },
};

const COPY = {
    clear: 'Clear: no clouds. The sun disc by day, a crescent moon and a few stars at night.',
    cloudy: 'Partly cloudy: a few soft, misty clouds drift in a band across the top of the view, each a different cumulus or stratocumulus shape with a flatter, ragged base and thin wisps. Soft lilac cloud shadows slide across the garden with the wind.',
    overcast: 'Overcast: one continuous, misty cloud deck across the top of the view, with a soft, undulating lower edge and brighter and darker masses inside, and a faint haze that fades out by mid-screen. The sun hides, the light flattens into lavender, and large, slow cloud shadows keep moving over the garden.',
    rain: 'Rain: a cooler lilac-grey deck, slim light-blue streaks with a rounded, slightly brighter leading end, small thin rings where drops land, puddles on the path, and a glossier, richer garden instead of a darker one.',
    heavyrain: 'Heavy rain: more and longer streaks with more slant from the wind, more splash rings and full puddles. Plants, beds and items still read between the streaks.',
    storm: 'Storm: a deeper violet-slate deck over a violet sky. Every 7 to 11 seconds a chunky yellow bolt grows down from the deck into free sky, bounces once and pulls back, never touching the garden. Only the bolt and a small glow on the deck change; no light, fog or sky flash.',
    snow: 'Snow: soft two-tone flakes in three sizes with a few ice-blue icon snowflakes that spin slowly, and a clean blue-white cover with a rounded lip.',
    fog: 'Fog: low lilac mist bands hug the ground and slide slowly sideways, rolls of mist wrap the island rim, and the back of the garden softens a little. Beds, plants and items stay readable.',
    windy: 'Windy: curly swooshes draw themselves in free sky, a few leaves tumble past and plants sway and lean.',
};

// ------------------------------------------------------------- renderer
let renderer;
try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch {
    stage.querySelector('.gps-fallback').style.display = 'grid';
}

if (renderer) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 200);
    const cameraTarget = new THREE.Vector3(0, 0.42, 0);
    camera.position.set(-40, 40.42, -40);
    camera.lookAt(cameraTarget);

    const controls = new OrbitControls(camera, canvas);
    controls.target.copy(cameraTarget);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.minPolarAngle = THREE.MathUtils.degToRad(38);
    controls.maxPolarAngle = THREE.MathUtils.degToRad(66);
    controls.update();

    const environmentMap = createSkyEnvironment(renderer);
    scene.environment = environmentMap;
    scene.environmentIntensity = 0.42;

    // ------------------------------------------------------------ state
    const requestedWeather = params.get('weather');
    const requestedTime = params.get('time');
    const state = {
        weather: requestedWeather in WEATHER ? requestedWeather : 'cloudy',
        time: requestedTime in TIMES ? requestedTime : 'midday',
        windOverride: params.has('wind') ? Number(params.get('wind')) : null,
        reduced: params.get('rm') === '1' || prefersReduced,
    };
    // Blended values (weatherBlend.ts style exponential damping).
    const blend = { cloud: 0, rain: 0, snow: 0, fog: 0, thunder: 0, wind: 0, cover: 0, wet: 0 };
    const targetOf = () => {
        const preset = WEATHER[state.weather];
        return {
            ...preset,
            wind: state.windOverride ?? preset.wind,
            wet: preset.rain > 0 ? 0.55 + 0.45 * preset.rain : 0,
        };
    };
    Object.assign(blend, targetOf());

    let needsRender = true;
    let elapsed = frozenTime ?? 0;
    let lastFrame = performance.now();
    let visible = true;

    controls.addEventListener('change', () => {
        needsRender = true;
    });

    // ---------------------------------------------------------- lights
    function createSkyEnvironment(gl) {
        const envScene = new THREE.Scene();
        const dome = new THREE.SphereGeometry(10, 32, 16);
        const top = new THREE.Color('#7cc8ff');
        const horizon = new THREE.Color('#fff3da');
        const ground = new THREE.Color('#8fcb62');
        const color = new THREE.Color();
        const colors = [];
        const position = dome.attributes.position;
        for (let i = 0; i < position.count; i++) {
            const height = position.getY(i) / 10;
            if (height >= 0) color.copy(horizon).lerp(top, height ** 0.6);
            else color.copy(horizon).lerp(ground, (-height) ** 0.5);
            colors.push(color.r, color.g, color.b);
        }
        dome.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        envScene.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
        const softbox = new THREE.Mesh(
            new THREE.SphereGeometry(2.4, 16, 12),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(7, 6.6, 6) }),
        );
        softbox.position.set(-3, 7.5, -5);
        envScene.add(softbox);
        const generator = new THREE.PMREMGenerator(gl);
        const texture = generator.fromScene(envScene, 0.035).texture;
        generator.dispose();
        return texture;
    }

    const hemi = new THREE.HemisphereLight('#c4e4ff', '#ffdcae', 1.55);
    const key = new THREE.DirectionalLight('#fff0d2', 2.55);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.radius = 4.5;
    key.shadow.intensity = 0.82;
    key.shadow.normalBias = 0.03;
    key.shadow.bias = -0.0004;
    Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 50 });
    const fill = new THREE.DirectionalLight('#a8d0ff', 0.75);
    fill.position.set(-6, 5, 3);
    scene.add(hemi, key, fill, key.target);

    // ------------------------------------------------ shared weather uniforms
    // One set of uniform objects shared by every lit material, like the
    // game's WeatherSurfaceUniformRegistry and cloud shadow uniforms.
    // Cloud shadows are their own layer of soft ellipses that drift over the
    // garden with the wind. They are not tied to the visible clouds, which sit
    // in free sky and so can never project onto the garden.
    const MAX_SHADOWS = 6;
    const W = {
        uWet: { value: 0 },
        uSnow: { value: 0 },
        uSnowColor: { value: new THREE.Color('#e3ebf8') },
        uFog: { value: 0 },
        uMistColor: { value: new THREE.Color('#eef0ff') },
        uMistPhase: { value: 0 },
        uAxisR: { value: new THREE.Vector2(-Math.SQRT1_2, Math.SQRT1_2) },
        uLightDir: { value: new THREE.Vector3(5, 10, -6).normalize() },
        // Screen-up axis, view centre and half view height in world units:
        // the back haze follows screen height, so it is the same at any zoom.
        uViewUp: { value: new THREE.Vector3(0, 1, 0) },
        uViewCenter: { value: new THREE.Vector3() },
        uHalfH: { value: 4 },
        uCloudShadow: { value: Array.from({ length: MAX_SHADOWS }, () => new THREE.Vector4(0, 0, 1, 1)) },
        uCloudShadowAmt: { value: new Array(MAX_SHADOWS).fill(0) },
        uCloudShadowTint: { value: new THREE.Color('#c7cdfa') },
        uSkySheen: { value: new THREE.Color('#bfe4ff') },
    };

    // ------------------------------------------------------------ textures

    async function loadPaintedTextures() {
        const loader = new THREE.TextureLoader();
        const entries = await Promise.all(
            Object.entries(textureSources).map(async ([name, source]) => {
                const texture = await loader.loadAsync(source);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.anisotropy = 8;
                return [name, texture];
            }),
        );
        return Object.fromEntries(entries);
    }

    function pathMaskTexture() {
        const size = 256;
        const surface = document.createElement('canvas');
        surface.width = size;
        surface.height = size;
        const context = surface.getContext('2d');
        context.fillStyle = '#000000';
        context.fillRect(0, 0, size, size);
        const toPixelX = (x) => ((x + 2.5) / 5) * size;
        const toPixelY = (z) => ((2.5 - z) / 5) * size;
        const leftEdge = (z) => -1.46 - 0.045 * Math.sin(z * 2.3 + 1) - 0.03 * Math.sin(z * 5.1 + 2.4);
        const rightEdge = (z) => -0.54 + 0.045 * Math.sin(z * 2.7 + 4) + 0.03 * Math.sin(z * 4.6 + 0.7);
        context.globalCompositeOperation = 'lighter';
        context.fillStyle = '#ffffff';
        for (const [grow, alpha] of [[0.07, 0.34], [0.035, 0.33], [0, 0.33]]) {
            context.globalAlpha = alpha;
            context.beginPath();
            for (let z = -2.7; z <= 2.7; z += 0.1) context.lineTo(toPixelX(leftEdge(z) - grow), toPixelY(z));
            for (let z = 2.7; z >= -2.7; z -= 0.1) context.lineTo(toPixelX(rightEdge(z) + grow), toPixelY(z));
            context.closePath();
            context.fill();
        }
        return new THREE.CanvasTexture(surface);
    }

    const snowRole = {
        grass: 1, dirt: 1, islandSoil: 1, soil: 0.9, wood: 0.9, woodDark: 0.9, trunk: 0.5, leaves: 0.85,
        leavesLight: 1, bush: 0.8, stone: 1, metal: 0.7, water: 0, petal: 0.3, petalShade: 0.3,
        flowerCenter: 0.3, stem: 0.25, cropLeaf: 0.3, cropLeafLight: 0.3, tomato: 0.15, carrot: 0.15,
        blossom: 0.3, pebble: 1,
    };
    const wetRole = {
        grass: 0.8, dirt: 1, islandSoil: 0.6, soil: 1, wood: 0.8, woodDark: 0.8, trunk: 0.7, leaves: 0.6,
        leavesLight: 0.6, bush: 0.6, stone: 1, metal: 0.3, water: 0, petal: 0.5, petalShade: 0.5,
        flowerCenter: 0.5, stem: 0.5, cropLeaf: 0.5, cropLeafLight: 0.5, tomato: 0.3, carrot: 0.4,
        blossom: 0.5, pebble: 1,
    };

    // ------------------------------------------------------------ materials
    // The example's toy surface (height gradient, sky rim, world-projected
    // painted texture) plus the weather layer: snow on up-facing faces, wet
    // gloss and saturation, analytic cloud shadows and ground-hugging mist.
    function applyToySurface(material, options) {
        const {
            base, height, rim, map = null, mapScale = 1, vertical = false, anchored = true, blend: blendMap = null,
            snow = 1, wet = 1, snowLip = 0, mistCap = 0.3, snowRange = [0.22, 0.62],
        } = options;
        material.defines = { ...material.defines };
        if (map) material.defines.USE_TOY_MAP = '';
        if (vertical) material.defines.TOY_MAP_VERTICAL = '';
        if (blendMap) material.defines.USE_TOY_BLEND = '';
        material.onBeforeCompile = (shader) => {
            Object.assign(shader.uniforms, W, {
                uToyGradient: { value: new THREE.Vector2(base, height) },
                uToyShade: { value: new THREE.Vector3(0.66, 0.74, 0.98) },
                uToyTint: { value: new THREE.Vector3(1.06, 1.03, 0.93) },
                uToyRim: { value: rim },
                uToyAnchor: { value: anchored ? 1 : 0 },
                uToyMap: { value: map },
                uToyMapScale: { value: mapScale },
                uToyMap2: { value: blendMap?.map ?? null },
                uToyMask: { value: blendMap?.mask ?? null },
                uToyMaskRect: { value: new THREE.Vector4(...(blendMap?.rect ?? [0, 0, 1, 1])) },
                uSnowMul: { value: snow },
                uSnowLip: { value: snowLip },
                uSnowRange: { value: new THREE.Vector2(...snowRange) },
                uWetMul: { value: wet },
                uMistCap: { value: mistCap },
            });
            shader.vertexShader = shader.vertexShader
                .replace(
                    '#include <common>',
                    [
                        '#include <common>',
                        'varying float vToyHeight;',
                        'varying vec3 vToyPosition;',
                        'varying vec3 vToyWorld;',
                        'varying vec3 vToyNormal;',
                        'uniform float uToyAnchor;',
                    ].join('\n'),
                )
                .replace(
                    '#include <begin_vertex>',
                    [
                        '#include <begin_vertex>',
                        'vec4 toyWorld = modelMatrix * vec4(transformed, 1.0);',
                        '#ifdef USE_INSTANCING',
                        'toyWorld = modelMatrix * instanceMatrix * vec4(transformed, 1.0);',
                        '#endif',
                        'vToyHeight = toyWorld.y;',
                        'vToyWorld = toyWorld.xyz;',
                        'vToyPosition = toyWorld.xyz - modelMatrix[3].xyz * uToyAnchor;',
                        'vToyNormal = mat3(modelMatrix) * objectNormal;',
                    ].join('\n'),
                );
            shader.fragmentShader = shader.fragmentShader
                .replace(
                    '#include <common>',
                    [
                        '#include <common>',
                        'varying float vToyHeight;',
                        'varying vec3 vToyPosition;',
                        'varying vec3 vToyWorld;',
                        'varying vec3 vToyNormal;',
                        'uniform vec2 uToyGradient;',
                        'uniform vec3 uToyShade;',
                        'uniform vec3 uToyTint;',
                        'uniform float uToyRim;',
                        'uniform float uWet;',
                        'uniform float uWetMul;',
                        'uniform float uSnow;',
                        'uniform float uSnowMul;',
                        'uniform float uSnowLip;',
                        'uniform vec2 uSnowRange;',
                        'uniform vec3 uSnowColor;',
                        'uniform float uMistCap;',
                        'uniform vec3 uViewUp;',
                        'uniform vec3 uViewCenter;',
                        'uniform float uHalfH;',
                        'uniform float uFog;',
                        'uniform vec3 uMistColor;',
                        'uniform float uMistPhase;',
                        'uniform vec2 uAxisR;',
                        'uniform vec3 uLightDir;',
                        'uniform vec4 uCloudShadow[' + MAX_SHADOWS + '];',
                        'uniform float uCloudShadowAmt[' + MAX_SHADOWS + '];',
                        'uniform vec3 uCloudShadowTint;',
                        'uniform vec3 uSkySheen;',
                        // Soft analytic cloud shadows: project the fragment along the
                        // key light to the ground plane and test the cloud footprints.
                        'float toyCloudShadow(vec3 p) {',
                        '    vec2 g = p.xz - p.y * uLightDir.xz / max(uLightDir.y, 0.2);',
                        '    vec2 axisD = vec2(-uAxisR.y, uAxisR.x);',
                        '    float s = 0.0;',
                        '    for (int i = 0; i < ' + MAX_SHADOWS + '; i++) {',
                        '        vec2 d = g - uCloudShadow[i].xy;',
                        '        vec2 l = vec2(dot(d, uAxisR), dot(d, axisD)) / uCloudShadow[i].zw;',
                        '        s = max(s, uCloudShadowAmt[i] * (1.0 - smoothstep(0.5, 1.0, length(l))));',
                        '    }',
                        '    return s;',
                        '}',
                        // Mist bands: rounded pills laid along the screen-horizontal
                        // axis, one row per 1.45 units of depth, sliding sideways.
                        'float toyMistBands(vec3 p) {',
                        '    vec2 axisD = vec2(-uAxisR.y, uAxisR.x);',
                        '    float along = dot(p.xz, uAxisR);',
                        '    float depth = dot(p.xz, axisD);',
                        '    float k = floor(depth / 1.45 + 0.5);',
                        '    float f = depth / 1.45 - k;',
                        '    float band = smoothstep(0.42, 0.1, abs(f));',
                        '    float phase = along * 0.62 + k * 2.17 + uMistPhase * (0.8 + 0.3 * sin(k * 1.7));',
                        '    float pills = smoothstep(-0.45, 0.6, sin(phase));',
                        '    return band * pills;',
                        '}',
                        '#ifdef USE_TOY_MAP',
                        'uniform sampler2D uToyMap;',
                        'uniform sampler2D uToyMap2;',
                        'uniform sampler2D uToyMask;',
                        'uniform float uToyMapScale;',
                        'uniform vec4 uToyMaskRect;',
                        'vec3 toyTriplanar(sampler2D source, vec3 position, vec3 weights) {',
                        '    #ifdef TOY_MAP_VERTICAL',
                        '        return texture2D(source, position.yz).rgb * weights.x',
                        '            + texture2D(source, position.zx).rgb * weights.y',
                        '            + texture2D(source, position.yx).rgb * weights.z;',
                        '    #else',
                        '        return texture2D(source, position.zy).rgb * weights.x',
                        '            + texture2D(source, position.xz).rgb * weights.y',
                        '            + texture2D(source, position.xy).rgb * weights.z;',
                        '    #endif',
                        '}',
                        '#endif',
                    ].join('\n'),
                )
                .replace(
                    '#include <color_fragment>',
                    [
                        '#include <color_fragment>',
                        'float toyPath = 0.0;',
                        '#ifdef USE_TOY_MAP',
                        '    vec3 toyWeights = pow(abs(normalize(vToyNormal)), vec3(4.0));',
                        '    toyWeights /= toyWeights.x + toyWeights.y + toyWeights.z;',
                        '    vec3 toyTexel = toyTriplanar(uToyMap, vToyPosition * uToyMapScale, toyWeights);',
                        '    #ifdef USE_TOY_BLEND',
                        '        vec3 toySecond = toyTriplanar(uToyMap2, vToyPosition * uToyMapScale, toyWeights);',
                        '        float toyMask = texture2D(uToyMask, (vToyPosition.xz - uToyMaskRect.xy) / uToyMaskRect.zw).r;',
                        '        toyPath = smoothstep(0.3, 0.7, toyMask);',
                        '        toyTexel = mix(toyTexel, toySecond, toyPath);',
                        '        toyTexel *= 1.0 - 0.14 * (1.0 - abs(toyMask * 2.0 - 1.0));',
                        '    #endif',
                        '    diffuseColor.rgb *= toyTexel;',
                        '#endif',
                        // Wet: richer, not darker. A little more saturation.
                        'float toyWet = uWet * uWetMul;',
                        'float toyLuma = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));',
                        'diffuseColor.rgb = max(mix(vec3(toyLuma), diffuseColor.rgb, 1.0 + 0.22 * toyWet), 0.0);',
                        'float toyRamp = clamp((vToyHeight - uToyGradient.x) / uToyGradient.y, 0.0, 1.0);',
                        'toyRamp = toyRamp * toyRamp * (3.0 - 2.0 * toyRamp);',
                        'diffuseColor.rgb *= mix(uToyShade, uToyTint, toyRamp);',
                        // Snow settles on faces that look up; the path stays a little
                        // warmer so it still reads as a trodden path.
                        'vec3 toyN = normalize(vToyNormal);',
                        'float toySnow = uSnow * uSnowMul * smoothstep(uSnowRange.x, uSnowRange.y, toyN.y) * mix(1.0, 0.82, toyPath);',
                        // A rounded snow lip folds over the top edge of the grass slab.
                        'toySnow = max(toySnow, uSnow * uSnowLip * smoothstep(-0.215, -0.17, vToyWorld.y));',
                        'diffuseColor.rgb = mix(diffuseColor.rgb, uSnowColor, toySnow);',
                    ].join('\n'),
                )
                .replace(
                    '#include <roughnessmap_fragment>',
                    [
                        '#include <roughnessmap_fragment>',
                        'roughnessFactor = mix(roughnessFactor, 0.26, toyWet * (1.0 - toySnow));',
                        'roughnessFactor = mix(roughnessFactor, 0.85, toySnow);',
                    ].join('\n'),
                )
                .replace(
                    '#include <opaque_fragment>',
                    [
                        'float toyFacing = clamp(dot(normal, geometryViewDir), 0.0, 1.0);',
                        'float toyRim = pow(1.0 - toyFacing, 2.5) * smoothstep(-0.1, 0.7, normal.y);',
                        'outgoingLight += vec3(0.72, 0.9, 1.0) * (uToyRim * toyRim);',
                        // Wet sheen: a soft sky-coloured lift on up-facing wet faces.
                        'outgoingLight += uSkySheen * (0.07 * toyWet * smoothstep(0.5, 1.0, toyN.y) * (1.0 - toySnow));',
                        // Snow keeps its own light so it stays clean blue-white
                        // under cloud instead of going grey (like the game's snow).
                        'outgoingLight = mix(outgoingLight, max(outgoingLight, uSnowColor * 0.62), toySnow);',
                        'float toyShadow = toyCloudShadow(vToyWorld);',
                        'outgoingLight *= mix(vec3(1.0), uCloudShadowTint, toyShadow);',
                        // Ground-hugging mist, densest at the ground, gone by 0.45 up.
                        'float toyMist = uFog * (0.08 + 0.46 * toyMistBands(vToyWorld)) * smoothstep(0.42, -0.03, vToyWorld.y);',
                        // Aerial depth: the top of the screen softens into the sky,
                        // at most 20%, whatever the zoom or garden size.
                        'float toyUp = dot(vToyWorld - uViewCenter, uViewUp) / uHalfH;',
                        'toyMist = max(toyMist, uFog * 0.2 * smoothstep(-0.2, 0.95, toyUp));',
                        // Ground may take more mist than beds, plants and items.
                        'outgoingLight = mix(outgoingLight, uMistColor, clamp(toyMist, 0.0, uMistCap));',
                        '#include <opaque_fragment>',
                    ].join('\n'),
                );
        };
        const variant = [map ? 'map' : '', vertical ? 'vertical' : '', blendMap ? 'blend' : ''].join('-');
        material.customProgramCacheKey = () => `toy-weather-surface-${variant}`;
    }

    function createMaterialFactory(disposables) {
        const cache = new Map();
        return (role, options = {}) => {
            const { base = 0, height = 1, flat = false, side = THREE.FrontSide, vertical = false, snowRange = null } = options;
            const k = [role, base, height, flat, side, vertical, snowRange].join('|');
            if (cache.has(k)) return cache.get(k);
            const [color, roughness] = palette[role];
            const painted = partyTextures[role];
            const material = new THREE.MeshStandardMaterial({
                color: painted ? new THREE.Color().setRGB(...painted[2]) : color,
                roughness,
                metalness: 0,
                flatShading: flat,
                side,
            });
            material.envMapIntensity = 1;
            applyToySurface(material, {
                base,
                height,
                rim: 0.5,
                map: painted ? textures[painted[0]] : null,
                mapScale: painted ? painted[1] : 1,
                vertical,
                snow: snowRole[role] ?? 1,
                wet: wetRole[role] ?? 1,
                // Ground takes more mist than the things standing on it.
                mistCap: role === 'islandSoil' ? 0.45 : 0.3,
                snowRange: snowRange ?? [0.22, 0.62],
            });
            cache.set(k, material);
            disposables.push(material);
            return material;
        };
    }

    function createBlobTexture() {
        const size = 128;
        const blob = document.createElement('canvas');
        blob.width = size;
        blob.height = size;
        const context = blob.getContext('2d');
        const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.55, 'rgba(255,255,255,0.55)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(blob);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
    }

    // ------------------------------------------------------------- world
    // The example's party island, unchanged in layout and look.
    function buildWorld() {
        const root = new THREE.Group();
        const disposables = [];
        const entities = [];
        const material = createMaterialFactory(disposables);
        const track = (geometry) => {
            disposables.push(geometry);
            return geometry;
        };
        const roundedBox = (w, h, d, radius, segments = 4) => track(new RoundedBoxGeometry(w, h, d, segments, radius));
        const sphere = (radius, w = 24, h = 16) => track(new THREE.SphereGeometry(radius, w, h));
        const cylinder = (top, bottom, h, segments = 20, open = false) =>
            track(new THREE.CylinderGeometry(top, bottom, h, segments, 1, open));

        function mesh(parent, geometry, mat, position = [0, 0, 0], options = {}) {
            const item = new THREE.Mesh(geometry, mat);
            item.position.set(position[0], position[1], position[2]);
            if (options.scale) item.scale.set(...options.scale);
            if (options.rotation) item.rotation.set(...options.rotation);
            item.castShadow = options.cast ?? true;
            item.receiveShadow = options.receive ?? true;
            parent.add(item);
            return item;
        }

        function entity(x, z, build, options = {}) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            root.add(group);
            const st = {
                group,
                breatheNode: null,
                breathe: options.breathe ?? 0,
                sway: options.sway ?? 0,
                windSway: options.windSway ?? 0,
                phase: (x * 1.7 + z * 2.3) % 6.28,
            };
            group.userData.entity = st;
            build(group, st);
            entities.push(st);
            return st;
        }

        let blobMaterial = null;
        function contactShadow(parent, radiusX, radiusZ, y = 0.012, opacity = 0.34) {
            if (!blobMaterial) {
                const texture = createBlobTexture();
                disposables.push(texture);
                blobMaterial = new THREE.MeshBasicMaterial({
                    map: texture, color: '#12402e', transparent: true, opacity: 1, depthWrite: false, toneMapped: false,
                });
                disposables.push(blobMaterial);
            }
            const mat = blobMaterial.clone();
            mat.opacity = opacity;
            disposables.push(mat);
            const plane = new THREE.Mesh(track(new THREE.PlaneGeometry(1, 1)), mat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = y;
            plane.scale.set(radiusX * 2, radiusZ * 2, 1);
            plane.renderOrder = 1;
            parent.add(plane);
        }

        // ---- terrain
        mesh(root, roundedBox(4.92, 0.46, 4.92, 0.15, 6), material('islandSoil', { base: -0.62, height: 0.5 }), [0, -0.37, 0]);
        const ground = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.74, metalness: 0 });
        ground.envMapIntensity = 1;
        applyToySurface(ground, {
            base: -0.3, height: 0.3, rim: 0.5, map: textures.grass, mapScale: 0.5, anchored: false,
            blend: { map: textures.path, mask: textures.pathMask, rect: [-2.5, -2.5, 5, 5] },
            snow: 1, wet: 0.9, snowLip: 1, mistCap: 0.45,
        });
        disposables.push(ground);
        mesh(root, roundedBox(5, 0.2, 5, 0.07, 6), ground, [0, -0.1, 0]);

        // ---- raised bed
        entity(0, -0.5, (group) => {
            const board = material('wood', { base: -0.05, height: 0.5 });
            const post = material('woodDark', { base: -0.05, height: 0.6, vertical: true });
            const longPlank = roundedBox(0.12, 0.17, 1.74, 0.035);
            const shortPlank = roundedBox(0.74, 0.17, 0.12, 0.035);
            for (const level of [0.095, 0.285]) {
                mesh(group, longPlank, board, [-0.41, level, 0]);
                mesh(group, longPlank, board, [0.41, level, 0]);
                mesh(group, shortPlank, board, [0, level, -0.91]);
                mesh(group, shortPlank, board, [0, level, 0.91]);
            }
            const corner = roundedBox(0.19, 0.5, 0.19, 0.055);
            for (const [x, z] of [[-0.41, -0.91], [0.41, -0.91], [-0.41, 0.91], [0.41, 0.91]]) {
                mesh(group, corner, post, [x, 0.25, z]);
            }
            mesh(group, roundedBox(0.72, 0.12, 1.72, 0.04), material('soil', { base: -0.1, height: 0.4 }), [0, 0.25, 0]);
            contactShadow(group, 0.78, 1.3, 0.012, 0.3);
        });

        const soilTop = 0.31;
        const cropSlots = [
            ['lettuce', 0.17, -1.17], ['carrot', -0.17, -1.2], ['tomato', 0.17, -0.7], ['lettuce', -0.17, -0.66],
            ['carrot', 0.17, -0.22], ['tomato', -0.17, -0.16], ['lettuce', 0.17, 0.24], ['sprout', -0.17, 0.28],
        ];
        for (const [kind, x, z] of cropSlots) {
            entity(x, z, (group, st) => {
                const plant = new THREE.Group();
                plant.position.y = soilTop;
                group.add(plant);
                st.breatheNode = plant;
                plant.scale.setScalar(1.3);
                buildPartyCrop(plant, kind);
            }, { breathe: 0.035, windSway: 0.05 });
        }

        function buildPartyCrop(plant, kind) {
            const leaf = material('cropLeaf', { base: soilTop, height: 0.4 });
            const leafLight = material('cropLeafLight', { base: soilTop, height: 0.4 });
            const blob = sphere(1, 16, 12);
            if (kind === 'lettuce') {
                mesh(plant, blob, leafLight, [0, 0.07, 0], { scale: [0.075, 0.08, 0.075] });
                for (let i = 0; i < 7; i++) {
                    const angle = (i / 7) * Math.PI * 2;
                    const petal = mesh(plant, blob, i % 2 ? leaf : leafLight, [Math.cos(angle) * 0.085, 0.05, Math.sin(angle) * 0.085], { scale: [0.085, 0.03, 0.065] });
                    petal.rotation.set(0, -angle, 0.5, 'YXZ');
                }
            } else if (kind === 'carrot') {
                mesh(plant, blob, material('carrot', { base: soilTop, height: 0.2 }), [0, 0.012, 0], { scale: [0.05, 0.035, 0.05] });
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const frond = mesh(plant, blob, i % 2 ? leaf : leafLight, [Math.cos(angle) * 0.045, 0.12, Math.sin(angle) * 0.045], { scale: [0.028, 0.11, 0.028] });
                    frond.rotation.set(0, -angle, -0.38, 'YXZ');
                }
            } else if (kind === 'tomato') {
                mesh(plant, cylinder(0.014, 0.014, 0.5, 10), material('woodDark', { base: soilTop, height: 0.5, vertical: true }), [0.05, 0.25, 0.03]);
                mesh(plant, blob, leaf, [0, 0.12, 0], { scale: [0.11, 0.1, 0.11] });
                mesh(plant, blob, leafLight, [0.02, 0.25, -0.01], { scale: [0.095, 0.09, 0.095] });
                mesh(plant, blob, leaf, [-0.01, 0.36, 0.01], { scale: [0.075, 0.075, 0.075] });
                const fruit = material('tomato', { base: soilTop, height: 0.5 });
                for (const [x, y, z, size] of [[-0.09, 0.13, -0.05, 0.052], [-0.05, 0.25, -0.09, 0.046], [-0.1, 0.3, 0.02, 0.04]]) {
                    mesh(plant, blob, fruit, [x, y, z], { scale: [size, size, size] });
                }
            } else {
                mesh(plant, cylinder(0.014, 0.018, 0.1, 10), leaf, [0, 0.05, 0]);
                for (const direction of [-1, 1]) {
                    const seedLeaf = mesh(plant, blob, leafLight, [direction * 0.05, 0.11, 0], { scale: [0.055, 0.016, 0.036] });
                    seedLeaf.rotation.z = direction * 0.45;
                }
            }
        }

        // ---- tree
        entity(2, 2, (group, st) => {
            mesh(group, cylinder(0.12, 0.19, 0.72, 20), material('trunk', { base: 0, height: 0.8, vertical: true }), [0, 0.36, 0]);
            const canopy = new THREE.Group();
            canopy.position.y = 0.6;
            group.add(canopy);
            st.breatheNode = canopy;
            const leaves = material('leaves', { base: 0.55, height: 1.25 });
            // Under snow the lighter cap is covered all over, so no green
            // crescent of it shows between the dome's snow and its own.
            const leavesLight = material('leavesLight', { base: 0.55, height: 1.25, snowRange: [-0.7, -0.2] });
            const dome = track(new THREE.SphereGeometry(1, 40, 28));
            const domePosition = dome.attributes.position;
            for (let i = 0; i < domePosition.count; i++) {
                if (domePosition.getY(i) < -0.69) domePosition.setY(i, -0.69);
            }
            dome.computeVertexNormals();
            mesh(canopy, dome, leaves, [0, 0.7, 0], { scale: [0.66, 0.58, 0.66] });
            const puff = sphere(1, 28, 20);
            mesh(canopy, puff, leavesLight, [-0.14, 1.04, -0.1], { scale: [0.4, 0.24, 0.4] });
            const apple = material('tomato', { base: 0.6, height: 1.2 });
            for (const [x, y, z] of [[-0.53, 0.7, -0.39], [-0.23, 0.56, -0.6], [-0.64, 0.61, 0.13], [-0.41, 0.97, -0.41], [0.13, 0.76, -0.64]]) {
                mesh(canopy, puff, apple, [x, y, z], { scale: [0.07, 0.07, 0.07] });
            }
            contactShadow(group, 0.62, 0.62, 0.012, 0.36);
        }, { breathe: 0.022, windSway: 0.018 });

        // ---- bush
        entity(2, 0.1, (group, st) => {
            const shrub = new THREE.Group();
            group.add(shrub);
            st.breatheNode = shrub;
            const leaves = material('bush', { base: 0, height: 0.6 });
            const leavesLight = material('leavesLight', { base: 0, height: 0.6 });
            const puff = sphere(1, 24, 16);
            mesh(shrub, puff, leaves, [0, 0.24, 0], { scale: [0.33, 0.29, 0.33] });
            mesh(shrub, puff, leavesLight, [-0.2, 0.19, -0.15], { scale: [0.23, 0.2, 0.23] });
            mesh(shrub, puff, leaves, [0.19, 0.17, 0.17], { scale: [0.22, 0.19, 0.22] });

    // ================================================================ WEATHER

    // A point on screen (u right, v up, in world units from the view centre)

    function screenToWorld(u, v, altitude, out = new THREE.Vector3()) {
        const base = controls.target;
        const py = base.y + u * axisR.y + v * axisU.y;
        const s = (altitude - py) / axisF.y;
        return out.copy(base).addScaledVector(axisR, u).addScaledVector(axisU, v).addScaledVector(axisF, s);

    // --------------------------------------------------------------- sky
    const skyStars = [];

    const skyMaterial = new THREE.ShaderMaterial({
        depthTest: false,
        depthWrite: false,
        uniforms: {
            uTop: { value: new THREE.Vector3() },
            uMid: { value: new THREE.Vector3() },
            uBottom: { value: new THREE.Vector3() },
            uAspect: { value: 1.6 },
            uBodyPos: { value: new THREE.Vector2(0.12, 0.86) },
            uBodySize: { value: 0.05 },
            uSunVis: { value: 1 },
            uMoonVis: { value: 0 },
            uBodyColor: { value: new THREE.Vector3(1, 1, 1) },
            uBodyGlow: { value: new THREE.Vector3(1, 1, 1) },
            uStarVis: { value: 0 },
            uStars: { value: skyStars },
            uGlowPos: { value: new THREE.Vector2(0.8, 0.7) },
            uGlow: { value: 0 },
            uGlowColor: { value: srgb('#fff4d2') },
            uHaze: { value: 0 },
            uHazeColor: { value: new THREE.Vector3(1, 1, 1) },
            uHazeFull: { value: 0.7 },
        },
        vertexShader: /* glsl */ `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.9999, 1.0);

        `,
        fragmentShader: /* glsl */ `
            varying vec2 vUv;
            uniform vec3 uTop, uMid, uBottom, uBodyColor, uBodyGlow, uGlowColor, uHazeColor;
            uniform float uAspect, uBodySize, uSunVis, uMoonVis, uStarVis, uGlow, uHaze, uHazeFull;
            uniform vec2 uBodyPos, uGlowPos;
            uniform vec3 uStars[28];
            void main() {
                float y = vUv.y;
                vec3 c = y > 0.5 ? mix(uMid, uTop, smoothstep(0.5, 1.0, y)) : mix(uBottom, uMid, smoothstep(0.0, 0.5, y));
                vec2 p = vec2(vUv.x * uAspect, vUv.y);
                vec2 b = vec2(uBodyPos.x * uAspect, uBodyPos.y);
                float d = distance(p, b);
                float vis = max(uSunVis, uMoonVis);
                c = mix(c, uBodyGlow, vis * 0.45 * exp(-pow(d / (uBodySize * 3.2), 2.0)));
                c = mix(c, uBodyColor, uSunVis * smoothstep(uBodySize, uBodySize * 0.9, d));
                float bite = distance(p, b + vec2(uBodySize * 0.5, uBodySize * 0.28));
                float crescent = smoothstep(uBodySize, uBodySize * 0.9, d) * smoothstep(uBodySize * 0.78, uBodySize * 0.9, bite);
                c = mix(c, uBodyColor, uMoonVis * crescent);
                for (int i = 0; i < 28; i++) {
                    vec3 s = uStars[i];
                    float ds = distance(p, vec2(s.x * uAspect, s.y));
                    c = mix(c, vec3(1.0, 0.97, 0.88), uStarVis * smoothstep(s.z, s.z * 0.35, ds));
                }
                float dg = distance(p, vec2(uGlowPos.x * uAspect, uGlowPos.y));
                c = mix(c, uGlowColor, clamp(uGlow * 0.7 * exp(-pow(dg / 0.3, 2.0)), 0.0, 1.0));
                // Cloud haze: full at the band, gone by mid-screen. It is sky,

                c = mix(c, uHazeColor, uHaze * smoothstep(0.5, uHazeFull, y));

    // ------------------------------------------------- soft rolled forms
    // The fog rolls' form (the sky clouds are the cloud band below).
    // One soft form per roll. The surface is the zero set of a signed
    // distance field: a few ellipsoid lobes joined by a smooth union (so the
    // valleys between them are filleted, never a crease or an intersection)
    // on a wide, flat-bottomed base. A sphere is shrink-wrapped onto it and
    // the normals come from the field gradient, so it shades smoothly.
    const CLOUD_LOBES = [
        // [cx, cy, cz, rx, ry, rz]
        [[0.0, -0.06, 0, 0.94, 0.2, 0.4], [0.06, 0.16, 0.02, 0.44, 0.38, 0.36], [-0.5, 0.02, 0.04, 0.32, 0.27, 0.3], [0.54, 0.0, 0.0, 0.3, 0.24, 0.28]],
        [[0.0, -0.06, 0, 0.94, 0.2, 0.38], [-0.3, 0.12, 0.02, 0.38, 0.33, 0.33], [0.36, 0.1, 0.0, 0.36, 0.3, 0.32], [0.8, -0.02, 0.0, 0.18, 0.16, 0.2]],
        [[0.0, -0.06, 0, 0.92, 0.2, 0.38], [0.22, 0.15, 0.02, 0.42, 0.36, 0.34], [-0.42, 0.04, 0.04, 0.3, 0.25, 0.3]],
    ];
    // Fog bands use the same generator: one long, low form with soft bumps.
    const FOG_LOBES = [
        [[0.0, 0.0, 0, 1.0, 0.13, 0.22], [-0.5, 0.07, 0.0, 0.34, 0.17, 0.2], [0.05, 0.1, 0.0, 0.38, 0.19, 0.21], [0.58, 0.06, 0.0, 0.3, 0.15, 0.19]],
        [[0.0, 0.0, 0, 1.0, 0.13, 0.21], [-0.3, 0.1, 0.0, 0.42, 0.19, 0.2], [0.45, 0.07, 0.0, 0.36, 0.16, 0.19]],
    ];
    const CLOUD_BASE = -0.2;
    function cloudField(lobes, x, y, z, base = CLOUD_BASE) {
        let d = Infinity;
        const k = 0.16;
        for (const [cx, cy, cz, rx, ry, rz] of lobes) {
            const px = (x - cx) / rx;
            const py = (y - cy) / ry;
            const pz = (z - cz) / rz;
            const k0 = Math.hypot(px, py, pz);
            const k1 = Math.hypot(px / rx, py / ry, pz / rz);
            const e = k1 > 0 ? (k0 * (k0 - 1)) / k1 : -Math.min(rx, ry, rz);
            if (d === Infinity) d = e;
            else {
                const h = Math.max(k - Math.abs(d - e), 0) / k;
                d = Math.min(d, e) - h * h * k * 0.25;
            }
        }
        // Flat underside with a rounded lip: smooth max with the base plane.
        const b = base - y;
        const kb = 0.07;
        const hb = Math.max(kb - Math.abs(d - b), 0) / kb;
        return Math.max(d, b) + hb * hb * kb * 0.25;
    }
    function cloudGeometry(variant, lobes = CLOUD_LOBES[variant], base = CLOUD_BASE, originY = -0.04, segments = [72, 44]) {
        const field = (x, y, z) => cloudField(lobes, x, y, z, base);
        const g = new THREE.SphereGeometry(1, segments[0], segments[1]);
        g.deleteAttribute('uv');
        const p = g.attributes.position;
        const n = new THREE.Vector3();
        const origin = new THREE.Vector3(0, originY, 0);
        const v = new THREE.Vector3();
        const normals = new Float32Array(p.count * 3);
        for (let i = 0; i < p.count; i++) {
            n.fromBufferAttribute(p, i).normalize();
            // March out to the first exit from the field, then bisect.
            let inside = 0;
            let t = 0.02;
            while (t < 2 && field(origin.x + n.x * t, origin.y + n.y * t, origin.z + n.z * t) < 0) {
                inside = t;
                t += 0.01;
            }
            let lo = inside;
            let hi = t;
            for (let j = 0; j < 22; j++) {
                const mid = (lo + hi) / 2;
                if (field(origin.x + n.x * mid, origin.y + n.y * mid, origin.z + n.z * mid) < 0) lo = mid;
                else hi = mid;
            }
            v.copy(origin).addScaledVector(n, (lo + hi) / 2);
            p.setXYZ(i, v.x, v.y, v.z);
            const e = 0.004;
            const gx = field(v.x + e, v.y, v.z) - field(v.x - e, v.y, v.z);
            const gy = field(v.x, v.y + e, v.z) - field(v.x, v.y - e, v.z);
            const gz = field(v.x, v.y, v.z + e) - field(v.x, v.y, v.z - e);
            const len = Math.hypot(gx, gy, gz) || 1;
            normals[i * 3] = gx / len;
            normals[i * 3 + 1] = gy / len;
            normals[i * 3 + 2] = gz / len;
        }
        g.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
        g.computeBoundingBox();
        const bb = g.boundingBox;
        const sx = 1 / (bb.max.x - bb.min.x);
        g.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -(bb.max.z + bb.min.z) / 2);
        g.scale(sx, sx, sx);
        g.computeBoundingBox();
        return g;
    }
    const cloudBuildStart = performance.now();
    const fogGeometries = FOG_LOBES.map((lobes) => cloudGeometry(0, lobes, -0.08, -0.0, [96, 32]));
    const cloudBuildMs = performance.now() - cloudBuildStart;

    const cloudUniformsShared = {
        uLit: { value: srgb('#f7f6ff') },
        uShade: { value: srgb('#c4cbf5') },
        uRim: { value: srgb('#fbfaff') },
        uKeyDir: W.uLightDir,
        uGlowColor: { value: srgb('#fff2d0') },
        uGlowPos: { value: new THREE.Vector3() },
        uGlow: { value: 0 },
        uGlowRadius: { value: 0.8 },
    };
    function cloudMaterial(uniforms = cloudUniformsShared, depthWrite = true) {
        return new THREE.ShaderMaterial({
            transparent: true,
            depthWrite,
            uniforms: { ...uniforms, uOpacity: { value: 1 } },
            vertexShader: /* glsl */ `
                varying vec3 vN;
                varying vec3 vViewN;
                varying vec3 vWorld;
                void main() {
                    vec4 w = modelMatrix * vec4(position, 1.0);
                    vWorld = w.xyz;
                    vN = normalize(mat3(modelMatrix) * normal);
                    vViewN = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * viewMatrix * w;
                }
            `,
            fragmentShader: /* glsl */ `
                varying vec3 vN;
                varying vec3 vViewN;
                varying vec3 vWorld;
                uniform vec3 uLit, uShade, uRim, uKeyDir, uGlowColor, uGlowPos;
                uniform float uGlow, uGlowRadius, uOpacity;
                void main() {
                    vec3 n = normalize(vN);
                    float lambert = dot(n, normalize(uKeyDir));
                    // Gentle two-tone: a wide, soft step between shade and lit.
                    vec3 c = mix(uShade, uLit, smoothstep(-0.3, 0.5, lambert));
                    c = mix(c, uShade, 0.55 * smoothstep(0.1, -0.7, n.y));
                    float facing = clamp(normalize(vViewN).z, 0.0, 1.0);
                    c = mix(c, uRim, 0.4 * pow(1.0 - facing, 2.0) * smoothstep(-0.2, 0.6, n.y));
                    // Storm glow: only the striking cloud, only around the
                    // bolt's root, and never more than 40% toward the glow.
                    float g = uGlow * exp(-pow(distance(vWorld, uGlowPos) / uGlowRadius, 2.0));
                    c = mix(c, uGlowColor, clamp(g, 0.0, 0.4));
                    // Soft silhouette.
                    float alpha = uOpacity * smoothstep(0.02, 0.3, facing);
                    gl_FragColor = vec4(c, alpha);
                }
            `,
        });
    }

    // ---------------------------------------------------- garden footprint
    // The garden's silhouette on screen in view units (u right, v up, world
    // units from the view centre): the terrain block as a convex polygon and
    // each standing entity as a box. Sky props never overlap it. The game
    // gets the same from its stacks (block positions and heights).
    const footprintBoxes = [new THREE.Box3(new THREE.Vector3(-2.5, -0.62, -2.5), new THREE.Vector3(2.5, 0.04, 2.5))];
    world.root.updateMatrixWorld(true);
    for (const e of world.entities) footprintBoxes.push(new THREE.Box3().setFromObject(e.group).expandByScalar(0.04));
    const footprint = { hull: [], parts: [] };
    const toView = (p) => {
        tmpProj.copy(p).sub(controls.target);
        return [tmpProj.dot(axisR), tmpProj.dot(axisU)];
    };
    const tmpProj = new THREE.Vector3();
    const boxCorners = (box) => {
        const out = [];
        for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) out.push(new THREE.Vector3(x, y, z));
        return out;
    };
    const footprintCorners = footprintBoxes.map(boxCorners);
    function convexHull(points) {
        const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
        const lower = [];
        for (const q of p) {
            while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
            lower.push(q);
        }
        const upper = [];
        for (let i = p.length - 1; i >= 0; i--) {
            const q = p[i];
            while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
            upper.push(q);
        }
        return lower.slice(0, -1).concat(upper.slice(0, -1));
    }
    function updateFootprint() {
        footprint.hull = convexHull(footprintCorners[0].map(toView));
        footprint.parts = footprintCorners.slice(1).map((corners) => convexHull(corners.map(toView)));
    }
    // Separating-axis test between a rectangle and a convex polygon.
    function rectHitsPolygon(r, poly) {
        const rect = [[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]];
        for (const shape of [rect, poly]) {
            for (let i = 0; i < shape.length; i++) {
                const a = shape[i];
                const b = shape[(i + 1) % shape.length];
                const ax = b[1] - a[1];
                const ay = a[0] - b[0];
                let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
                for (const q of rect) { const d = q[0] * ax + q[1] * ay; minA = Math.min(minA, d); maxA = Math.max(maxA, d); }

        [0.5, 0.6, 0.8],

            across: ((i + 0.5) / MAX_SHADOWS) * 2 - 1 + (r() - 0.5) * 0.25,
            size: 0.85 + 0.3 * r(),
            aspect: 0.66 + 0.14 * r(),

    // ------------------------------------------------------------ rain
    const RAIN_CAPACITY = 1400;
    const rainGeometry = new THREE.InstancedBufferGeometry();
    rainGeometry.index = new THREE.PlaneGeometry(1, 1).index;
    {
        const plane = new THREE.PlaneGeometry(1, 1);
        rainGeometry.setAttribute('position', plane.attributes.position);
        rainGeometry.setAttribute('uv', plane.attributes.uv);
        const seeds = new Float32Array(RAIN_CAPACITY * 4);
        const r = mulberry32(seed * 101 + 3);
        for (let i = 0; i < RAIN_CAPACITY * 4; i++) seeds[i] = r();
        rainGeometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 4));
        rainGeometry.instanceCount = 0;
    }
    const rainMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
            uTime: { value: 0 },
            uCenter: { value: new THREE.Vector3() },
            uAxisR: { value: axisR },
            uAxisD: { value: axisD },
            uBox: { value: new THREE.Vector3(14, 10, 10) },
            uFall: { value: 7.5 },
            uWindR: { value: 0 },
            uSize: { value: new THREE.Vector2(0.05, 0.3) },
            uSizePx: { value: new THREE.Vector2(5, 14) },
            uHeadPx: { value: 2.5 },
            uHead: { value: srgb('#8fd2ff') },
            uTail: { value: srgb('#4aa8ff') },
            uAlpha: { value: 1 },
            uStill: { value: 0 },
        },
        vertexShader: /* glsl */ `
            attribute vec4 aSeed;
            uniform float uTime, uFall, uWindR, uStill, uAlpha;
            uniform vec3 uCenter, uAxisR, uAxisD, uBox;
            uniform vec2 uSize;
            varying vec2 vUv;
            varying float vAlpha;
            void main() {
                // Reduced motion slows the fall (uFall 1.4) instead of
                // stopping or pulsing the drops.
                float speed = uFall * (0.85 + 0.3 * aSeed.w);
                vec3 box = uBox;
                vec3 local = aSeed.xyz * box;
                local.y -= speed * uTime;
                local.x += uWindR * uTime;
                local = mod(local, box) - box * 0.5;
                local.y += 1.5;
                vec3 world = uCenter + uAxisR * local.x + uAxisD * local.z + vec3(0.0, local.y, 0.0);
                vec3 velocity = vec3(0.0, -uFall, 0.0) + uAxisR * uWindR;
                vec4 viewCenter = viewMatrix * vec4(world, 1.0);
                vec2 dir = normalize((viewMatrix * vec4(velocity, 0.0)).xy);
                vec2 side = vec2(-dir.y, dir.x);
                vec2 offset = side * position.x * uSize.x - dir * position.y * uSize.y;
                gl_Position = projectionMatrix * (viewCenter + vec4(offset, 0.0, 0.0));
                vUv = uv;
                // Fade near the top and bottom of the field so drops never pop.
                float edge = smoothstep(-box.y * 0.5 + 1.5, -box.y * 0.5 + 2.5, local.y - 1.5) * smoothstep(box.y * 0.5 + 1.5, box.y * 0.5 + 0.5, local.y);
                // Rain falls out of the cloud layer: no drops above its base.
                float belowClouds = smoothstep(2.7, 1.9, world.y);
                // Each drop sits between 0.55 and 0.75 opacity.
                vAlpha = uAlpha * edge * belowClouds * (0.55 + 0.2 * fract(aSeed.w * 7.31));
            }
        `,
        fragmentShader: /* glsl */ `
            uniform vec3 uHead, uTail;
            uniform vec2 uSizePx;
            uniform float uHeadPx;
            varying vec2 vUv;
            varying float vAlpha;
            void main() {
                // A slim falling raindrop as the eye sees it in motion: a
                // streak with a rounded, slightly brighter leading end and a
                // tail that tapers and fades. No teardrop head, no glint.
                float s = vUv.y * uSizePx.y; // px behind the leading tip
                float a = abs(vUv.x - 0.5) * uSizePx.x; // px from the axis
                float r = 0.5 * uHeadPx;
                float halfW = r * mix(1.0, 0.3, smoothstep(r, uSizePx.y, s));
                float dist = s < r ? length(vec2(a, r - s)) - r : a - halfW;

                float tail = 1.0 - smoothstep(0.3 * uSizePx.y, uSizePx.y, s);

        `,
    });
    const rain = new THREE.Mesh(rainGeometry, rainMaterial);

    // ----------------------------------------------------------- splashes
    const SPLASH_CAPACITY = 40;
    const splashGeometry = new THREE.InstancedBufferGeometry();
    {

        splashGeometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 2));
        splashGeometry.instanceCount = 0;
    }
    const splashMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
        uniforms: {
            uTime: { value: 0 },
            uLife: { value: 0.45 },
            uRadius: { value: 0.12 },
            uColor: { value: srgb('#f2faff') },
            uEdge: { value: srgb('#4fb2ff') },
            uAlpha: { value: 1 },
        },
        vertexShader: /* glsl */ `
            attribute vec2 aSeed;
            uniform float uTime, uLife, uRadius;
            varying vec2 vUv;
            varying float vProgress;
            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            void main() {
                float cycle = uTime / uLife + aSeed.x * 7.0;
                float index = floor(cycle);
                float progress = fract(cycle);
                vec2 xz = vec2(hash(index * 12.9898 + aSeed.y * 78.233), hash(index * 39.3468 + aSeed.y * 11.1351)) * 4.5 - 2.25;
                float y = 0.008;
                float keep = 1.0;
                // Soil inside the raised bed sits higher; skip the bed rim.
                vec2 bed = abs(xz - vec2(0.0, -0.5));
                if (bed.x < 0.32 && bed.y < 0.82) y = 0.318;
                else if (bed.x < 0.52 && bed.y < 1.02) keep = 0.0;
                // Skip props: tree trunk, bush, stones, bucket, sunflowers, fence.
                if (distance(xz, vec2(2.0, 2.0)) < 0.3) keep = 0.0;
                if (distance(xz, vec2(2.0, 0.1)) < 0.45) keep = 0.0;
                if (distance(xz, vec2(2.0, -1.95)) < 0.42) keep = 0.0;
                if (distance(xz, vec2(1.5, -2.15)) < 0.25) keep = 0.0;
                if (distance(xz, vec2(1.0, -1.05)) < 0.3) keep = 0.0;
                if (abs(xz.y - 2.38) < 0.15 && xz.x > -2.5 && xz.x < 0.5) keep = 0.0;
                float radius = uRadius * (0.25 + 0.75 * sqrt(progress)) * keep;

        `,
        fragmentShader: /* glsl */ `
            uniform vec3 uColor, uEdge;
            uniform float uAlpha;
            varying vec2 vUv;
            varying float vProgress;
            void main() {

                float fade = pow(1.0 - vProgress, 1.3);

                gl_FragColor = vec4(c, a);
                if (a < 0.004) discard;
            }
        `,
    });
    const splashes = new THREE.Mesh(splashGeometry, splashMaterial);
    splashes.frustumCulled = false;
    splashes.renderOrder = 5;
    splashes.name = 'Weather:RainSplashes';
    scene.add(splashes);

    // ------------------------------------------------------------ puddles
    // Flat, one-piece shapes with a smooth wobbly outline (two harmonics),
    // a sky reflection gradient, a light rim, a glint and ripple rings.
    function puddleGeometry(rx, rz, s) {
        const segments = 48;
        const positions = [0, 0, 0];
        const edge = [0];
        const outline = (a) => 1 + 0.1 * Math.sin(2 * a + s) + 0.07 * Math.sin(3 * a + s * 2.3);
        for (const ring of [0.78, 1]) {
            for (let i = 0; i < segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                const r = outline(a) * ring;
                positions.push(Math.cos(a) * rx * r, 0, Math.sin(a) * rz * r);
                edge.push(ring);
            }
        }
        const index = [];
        for (let i = 0; i < segments; i++) {
            const a = 1 + i;
            const b = 1 + ((i + 1) % segments);
            index.push(0, b, a);
            const c = 1 + segments + i;
            const d = 1 + segments + ((i + 1) % segments);
            index.push(a, b, d, a, d, c);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute('aEdge', new THREE.Float32BufferAttribute(edge, 1));
        g.setIndex(index);
        return g;
    }
    const puddleUniforms = {
        uTime: { value: 0 },
        uDeep: { value: srgb('#5ab8ff') },
        uLight: { value: srgb('#bfe6ff') },
        uRimColor: { value: srgb('#f2faff') },
        uRipples: { value: 1 },

        { x: -0.97, z: -1.28, rx: 0.17, rz: 0.27, s: 1.1 },

    const puddles = PUDDLES.map((p, i) => {
        const m = new THREE.Mesh(
            puddleGeometry(p.rx, p.rz, p.s),
            new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1,
                uniforms: { ...puddleUniforms, uAmount: { value: 0 }, uSeed: { value: i * 3.17 + 1 }, uSize: { value: new THREE.Vector2(p.rx, p.rz) } },
                vertexShader: /* glsl */ `
                    attribute float aEdge;
                    varying float vEdge;
                    varying vec2 vLocal;
                    void main() {
                        vEdge = aEdge;
                        vLocal = position.xz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

                fragmentShader: /* glsl */ `
                    uniform vec3 uDeep, uLight, uRimColor;
                    uniform float uAmount, uTime, uSeed, uRipples;
                    uniform vec2 uSize;
                    varying float vEdge;
                    varying vec2 vLocal;
                    float hash(float n) { return fract(sin(n) * 43758.5453123); }
                    void main() {
                        vec2 q = vLocal / uSize;
                        // Sky reflection: lighter toward the camera side.
                        float t = clamp(0.5 - 0.35 * (q.x + q.y), 0.0, 1.0);
                        vec3 c = mix(uDeep, uLight, t * 0.55);
                        float rim = smoothstep(0.8, 0.94, vEdge);
                        c = mix(c, uRimColor, rim * 0.8);
                        float glint = smoothstep(0.32, 0.12, length((q - vec2(0.32, 0.38)) * vec2(1.0, 1.7)));
                        c = mix(c, uRimColor, glint * 0.85);
                        for (int k = 0; k < 2; k++) {
                            float cycle = uTime / 0.9 + float(k) * 0.5 + uSeed;
                            float n = floor(cycle);
                            float pr = fract(cycle);
                            vec2 centre = (vec2(hash(n * 3.1 + uSeed + float(k)), hash(n * 7.7 + uSeed * 2.0 + float(k))) - 0.5) * 0.9;

                            float ring = smoothstep(0.16, 0.0, abs(r - pr)) * (1.0 - pr) * uRipples;
                            c = mix(c, uRimColor, ring * 0.8);

                        float alpha = uAmount * smoothstep(1.0, 0.95, vEdge);
                        gl_FragColor = vec4(c, alpha);
                    }
                `,
            }),
        );
        m.position.set(p.x, 0.006, p.z);
        m.renderOrder = 3;
        m.name = 'Weather:Puddle';
        scene.add(m);
        return m;
    });

    // --------------------------------------------------------------- snow
    const SNOW_CAPACITY = 820;
    const snowGeometry = new THREE.InstancedBufferGeometry();
    {
        const plane = new THREE.PlaneGeometry(1, 1);

        snowGeometry.setAttribute('position', plane.attributes.position);

    }
    const snowMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
            uTime: { value: 0 },
            uCenter: { value: new THREE.Vector3() },
            uAxisR: { value: axisR },
            uAxisD: { value: axisD },
            uBox: { value: new THREE.Vector3(14, 10, 10) },
            uFall: { value: 0.7 },
            uWindR: { value: 0.2 },
            uSlow: { value: 1 },
            uCore: { value: srgb('#fbfcff') },
            uEdge: { value: srgb('#b4cbf6') },
            uSizes: { value: new THREE.Vector3(0.07, 0.095, 0.125) },
        },
        vertexShader: /* glsl */ `
            attribute vec4 aSeed;
            uniform float uTime, uFall, uWindR, uSlow;

            varying float vAlpha;
            void main() {
                float t = uTime * uSlow;

                vec3 local = aSeed.xyz * box;
                local.y -= uFall * (0.8 + 0.45 * aSeed.w) * t;
                local.x += uWindR * t;
                // Gentle sideways drift, each flake on its own slow sine.
                local.x += 0.18 * sin(t * (1.4 + aSeed.w) + aSeed.z * 6.283);
                local = mod(local, box) - box * 0.5;
                local.y += 1.5;
                vec3 world = uCenter + uAxisR * local.x + uAxisD * local.z + vec3(0.0, local.y, 0.0);
                float size = aSeed.w < 0.5 ? uSizes.x : aSeed.w < 0.85 ? uSizes.y : uSizes.z;
                vec4 viewCenter = viewMatrix * vec4(world, 1.0);
                gl_Position = projectionMatrix * (viewCenter + vec4(position.xy * size, 0.0, 0.0));
                vUv = uv;
                vAlpha = smoothstep(-box.y * 0.5 + 1.5, -box.y * 0.5 + 2.5, local.y - 1.5) * smoothstep(box.y * 0.5 + 1.5, box.y * 0.5 + 0.5, local.y);

        `,
        fragmentShader: /* glsl */ `
            uniform vec3 uCore, uEdge;
            varying vec2 vUv;
            varying float vAlpha;
            void main() {

        `,
    });
    const snow = new THREE.Mesh(snowGeometry, snowMaterial);
    snow.frustumCulled = false;
    snow.renderOrder = 21;
    snow.name = 'Weather:Snow';
    scene.add(snow);

    // Hero flakes: about one in eight flakes is the snowflake icon, six
    // rounded arms with a V of branches, ice blue with a darker bevel rim and
    // a light glint, spinning slowly. It is a vector shape drawn on one quad
    // (a distance field, not a texture or noise), sized in pixels.
    const HERO_CAPACITY = 110;
    const heroGeometry = new THREE.InstancedBufferGeometry();
    {
        const plane = new THREE.PlaneGeometry(1, 1);
        heroGeometry.index = plane.index;
        heroGeometry.setAttribute('position', plane.attributes.position);
        heroGeometry.setAttribute('uv', plane.attributes.uv);
        const seeds = new Float32Array(HERO_CAPACITY * 4);

        for (let i = 0; i < HERO_CAPACITY * 4; i++) seeds[i] = r();
        heroGeometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 4));
        heroGeometry.instanceCount = 0;
    }
    const heroMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
            uTime: snowMaterial.uniforms.uTime,
            uCenter: snowMaterial.uniforms.uCenter,
            uAxisR: { value: axisR },
            uAxisD: { value: axisD },
            uBox: snowMaterial.uniforms.uBox,
            uFall: snowMaterial.uniforms.uFall,
            uWindR: snowMaterial.uniforms.uWindR,
            uSlow: snowMaterial.uniforms.uSlow,
            uSpin: { value: 0.6 },
            uPx: { value: new THREE.Vector2(0.2, 0.26) },
            uFace: { value: srgb('#8fd6fa') },
            uRimC: { value: srgb('#4aa6ee') },
            uHi: { value: srgb('#e2f6ff') },
        },
        vertexShader: /* glsl */ `
            attribute vec4 aSeed;
            uniform float uTime, uFall, uWindR, uSlow, uSpin;
            uniform vec3 uCenter, uAxisR, uAxisD, uBox;
            uniform vec2 uPx;
            varying vec2 vUv;
            varying float vAlpha;
            varying float vAngle;
            void main() {
                float t = uTime * uSlow;
                vec3 box = uBox;
                vec3 local = aSeed.xyz * box;
                local.y -= uFall * (0.75 + 0.3 * aSeed.w) * t;
                local.x += uWindR * t;
                local.x += 0.22 * sin(t * (1.1 + aSeed.w) + aSeed.z * 6.283);
                local = mod(local, box) - box * 0.5;
                local.y += 1.5;
                vec3 world = uCenter + uAxisR * local.x + uAxisD * local.z + vec3(0.0, local.y, 0.0);
                float size = mix(uPx.x, uPx.y, aSeed.w);
                vec4 viewCenter = viewMatrix * vec4(world, 1.0);
                gl_Position = projectionMatrix * (viewCenter + vec4(position.xy * size, 0.0, 0.0));
                vUv = uv;
                vAngle = aSeed.z * 6.283 + uSpin * t * (aSeed.x > 0.5 ? 1.0 : -1.0);
                vAlpha = smoothstep(-box.y * 0.5 + 1.5, -box.y * 0.5 + 2.5, local.y - 1.5) * smoothstep(box.y * 0.5 + 1.5, box.y * 0.5 + 0.5, local.y);
            }
        `,
        fragmentShader: /* glsl */ `
            uniform vec3 uFace, uRimC, uHi;
            varying vec2 vUv;
            varying float vAlpha;
            varying float vAngle;
            float segment(vec2 p, vec2 a, vec2 b) {
                vec2 pa = p - a;
                vec2 ba = b - a;
                float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
                return length(pa - ba * h);
            }
            float flake(vec2 p) {
                // Fold into one mirrored 30 degree wedge of a six-fold star.
                float r = length(p);
                float a = atan(p.y, p.x);
                float sector = 1.0471976;
                a = mod(a + sector * 0.5, sector) - sector * 0.5;
                vec2 q = vec2(cos(a), abs(sin(a))) * r;
                float d = segment(q, vec2(0.0), vec2(0.72, 0.0)) - 0.15;
                vec2 b0 = vec2(0.42, 0.0);
                d = min(d, segment(q, b0, b0 + 0.24 * vec2(0.72, 0.69)) - 0.12);
                d = min(d, r - 0.3);
                return d;
            }

                vec2 p = (vUv - 0.5) * 2.0;
                float ca = cos(vAngle);
                float sa = sin(vAngle);
                vec2 rp = vec2(ca * p.x - sa * p.y, sa * p.x + ca * p.y);
                float d = flake(rp);
                float aa = fwidth(d) * 1.2;
                float shape = smoothstep(aa, -aa, d);
                // A bevel rim inside the outline, the face lighter, and a soft
                // glint toward the upper left (screen space, so it never spins).
                float face = smoothstep(-0.035, -0.085, d);
                vec3 c = mix(uRimC, uFace, face);
                c = mix(c, uHi, 0.6 * face * smoothstep(0.75, 0.0, length(p - vec2(-0.3, 0.32))));
                float a = shape * vAlpha;
                gl_FragColor = vec4(c, a);
                if (a < 0.004) discard;
            }
        `,
    });
    const heroFlakes = new THREE.Mesh(heroGeometry, heroMaterial);
    heroFlakes.frustumCulled = false;
    heroFlakes.renderOrder = 22;
    heroFlakes.name = 'Weather:SnowHeroFlakes';
    scene.add(heroFlakes);

    // Settling sparkles on the snow cover.
    const SPARKLE_CAPACITY = 14;
    const sparkleGeometry = new THREE.InstancedBufferGeometry();
    {

        sparkleGeometry.index = plane.index;
        sparkleGeometry.setAttribute('position', plane.attributes.position);
        sparkleGeometry.setAttribute('uv', plane.attributes.uv);
        const seeds = new Float32Array(SPARKLE_CAPACITY * 2);
        const r = mulberry32(seed * 313 + 1);
        for (let i = 0; i < SPARKLE_CAPACITY * 2; i++) seeds[i] = r();
        sparkleGeometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 2));
        sparkleGeometry.instanceCount = 0;
    }
    const sparkleMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: { uTime: { value: 0 }, uAmount: { value: 0 }, uColor: { value: srgb('#fffbea') } },
        vertexShader: /* glsl */ `
            attribute vec2 aSeed;
            uniform float uTime, uAmount;
            varying vec2 vUv;
            varying float vLife;
            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            void main() {
                float cycle = uTime / 2.6 + aSeed.x * 5.0;
                float n = floor(cycle);
                float p = fract(cycle);
                vec2 xz = vec2(hash(n * 17.1 + aSeed.y * 31.7), hash(n * 5.3 + aSeed.y * 91.1)) * 4.5 - 2.25;
                float y = 0.03;

    function swooshGeometry() {
        const n = 64;
