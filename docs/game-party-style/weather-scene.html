            const s = i / n;

                y = 0.07 * Math.sin(k * Math.PI * 1.5);

        const along = [];
        const index = [];
        for (let i = 0; i <= n; i++) {
            const [x, y, s] = pts[i];
            const [x0, y0] = pts[Math.max(0, i - 1)];
            const [x1, y1] = pts[Math.min(n, i + 1)];
            let tx = x1 - x0;
            let ty = y1 - y0;

            tx /= len;
            ty /= len;
            const w = 0.022 * Math.pow(Math.sin(Math.PI * Math.min(1, s * 1.05)), 0.4) + 0.006;
            positions.push(x - ty * w - L / 2, y + tx * w, 0, x + ty * w - L / 2, y - tx * w, 0);

        vertexShader: /* glsl */ `
            attribute float aAlong;
            attribute vec4 aPlace; // screen u, v (view units), scale, progress

            uniform vec3 uCenter, uAxisR, uAxisU;

            varying float vProgress;

    function boltGeometry() {

    // The bolt is the lightning icon: a chunky zigzag, bevelled, a sunflower

    // bounces once in width and pulls back up into the cloud.
    const boltGeo = boltGeometry();

        depthWrite: false,

            uSide: { value: srgb('#ffb300') },
            uLight: { value: srgb('#fff3a6') },
            uOpacity: { value: 0 },
            uReveal: { value: 1 },
            uRetract: { value: 0 },
            uSpan: { value: new THREE.Vector2(...boltSpan) },

            uniform vec2 uSpan;
            varying vec3 vN;
            varying float vY;
            varying float vFromTop;

                vY = position.y;
                vFromTop = (uSpan.y - position.y) / (uSpan.y - uSpan.x);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,

            uniform vec3 uFront, uSide, uLight;
            uniform float uOpacity, uReveal, uRetract;
            varying vec3 vN;
            varying float vY;
            varying float vFromTop;

    // Strike schedule: deterministic per seed. The first strike lands at
    // 1.5 s so a shot with &t=1.6 shows it; then every 7 to 11 s, one flash
    // per strike. "Strike now" adds one, at least 6.5 s after the last.
    const strikes = [];
    {
        const r = mulberry32(seed * 977 + 13);
        let t = 1.5;
        for (let i = 0; i < 60; i++) {

    const STRIKE = { reveal: 0.09, hold: 0.42, gone: 0.62, glowEnd: 1.1, reducedIn: 1.0, reducedHold: 0.6, reducedOut: 1.0 };
    let manualStrike = null;

        const window = reduced ? STRIKE.reducedIn + STRIKE.reducedHold + STRIKE.reducedOut : STRIKE.glowEnd;
        let best = null;
        for (const s of strikes) {
            if (s.t > T) break;

            if (manualStrike && s.t > manualStrike.t && s.t - manualStrike.t < 6.5) continue;
            best = s;
        }
        if (manualStrike && manualStrike.t <= T && (!best || manualStrike.t > best.t)) best = manualStrike;

    const tmpColor = new THREE.Color();
    const tmpV = new THREE.Vector3();
    const qTmp = new THREE.Quaternion();
    const depthAxis = new THREE.Vector3(1, 0, 1).normalize();
    const tierMul = {
        low: { rain: 0.35, snow: 0.3, splash: 0, sparkle: 0.5, swoosh: 1, band: 3 },
        medium: { rain: 0.7, snow: 0.6, splash: 0.5, sparkle: 0.75, swoosh: 2, band: 4 },
        high: { rain: 1, snow: 1, splash: 1, sparkle: 1, swoosh: 4, band: 5 },
    }[quality];

    const WIND_PERP = new THREE.Vector2(Math.SQRT1_2, Math.SQRT1_2);

    function skyStops(time, b) {
        const T = TIMES[time];

        const overcast = clamp01((b.cloud - 0.3) / 0.6) * 0.9 + b.rain * 0.1;
        const apply = (stops, amount) => {

        apply(T.skyStorm, b.thunder * 0.9);

        const mixTone = (pair, t) => {
            lit.lerp(srgb(pair[0]), clamp01(t));
            shade.lerp(srgb(pair[1]), clamp01(t));
        };
        mixTone(tone.overcast, smoothstep(0.3, 0.9, b.cloud));
        mixTone(tone.rain, b.rain * 0.9);
        mixTone(tone.snow, b.snow * 1.2);
        mixTone(tone.storm, b.thunder);
        return [lit, shade];
    }

    // Finds a spot for a sky prop of half size (hu, hv) near (u0, v0): off
    // the garden footprint and off other sky props, never cut by the top
    // edge, and at most a quarter cut by a side or the bottom edge. It tries
    // the preferred spot, then moves outward from the view centre.
    function findFreeSpot(u0, v0, hu, hv, placed, halfW, halfH, pad) {
        const [padU, padV] = pad;
        const minU = -halfW + hu * 0.5;
        const maxU = halfW - hu * 0.5;
        const minV = -halfH + hv * 0.6;
        const maxV = halfH - hv - padV;
        if (minU > maxU || minV > maxV) return null;
        const len = Math.hypot(u0, v0) || 1;
        const dirs = [[u0 / len, v0 / len], [Math.sign(u0) || 1, 0], [0, Math.sign(v0) || 1], [0, -(Math.sign(v0) || 1)]];
        const step = Math.max(0.08, hv * 0.25);
        for (const [du, dv] of dirs) {

                const u = Math.min(maxU, Math.max(minU, u0 + du * step * k));
                const v = Math.min(maxV, Math.max(minV, v0 + dv * step * k));
                const r = [u - hu - padU, v - hv - padV, u + hu + padU, v + hv + padV];

        fill.intensity = TD.fill[1] * fillMul;

        W.uLightDir.value.set(...TD.key[2]).normalize();

        W.uSnow.value = b.cover;

        // Rain and storm decks lean cooler and greyer (still lilac, still light).

        // (35% under full cover), and no more than 10% of the view height

        const share = lerp(0.3, 0.35, deckAmt) * viewH;

        for (let c = 0; c < BAND_COLS; c++) {

                    const [u0, v0] = poly[k];
                    const [u1, v1] = poly[(k + 1) % poly.length];
                    if ((u0 - u) * (u1 - u) > 0 || u0 === u1) continue;

                }
            }

        }
        const raw = colTop.map((t) => Math.min(share, t + 0.1 * viewH));
        const reach = 7;
        const eroded = raw.map((_, c) => Math.min(...raw.slice(Math.max(0, c - reach), c + reach + 1)));
        const limits = eroded.map((_, c) => {
            const win = eroded.slice(Math.max(0, c - reach + 1), c + reach);

        });
        limits.forEach((l, c) => bu.uLimit.value[c >> 2].setComponent(c & 3, l));
        const limitAt = (xPx) => {
            const f = Math.min(BAND_COLS - 1, Math.max(0, (xPx / viewW) * BAND_COLS - 0.5));

        // Haze: 10 to 15% toward the cloud tone at the band, gone by

        // Separate clouds: seeded shapes that drift with the wind at 0.6 to

            pos.set(x, base, s, p * cl.opacity);

        }
        stats.clouds = visibleClouds;
        stats.deck = +deckAmt.toFixed(2);
        stats.bandLimitPx = Math.round(maxLimit);
        stats.bandMinPx = Math.round(Math.min(...limits));
        stats.bandOverGardenPct = +((100 * Math.max(0, overGarden)) / viewH).toFixed(1);
        cloudBand.visible = deckAmt > 0.001 || visibleClouds > 0;
        cloudBandOverGarden.visible = cloudBand.visible;
        // Clouds own the band: swooshes and sky mist rolls keep to the free
        // sky below it.
        const drift = px(16) * (1 + 0.15 * b.wind);
        const pad = [px(SKY.marginPx) + drift, px(SKY.marginPx + 5)];
        const placed = [];
        const bandReach = Math.max(deckAmt > 0.01 ? maxLimit : 0, lowestCloud);
        if (cloudBand.visible && bandReach > 0) placed.push([-2 * halfW, halfH - px(bandReach), 2 * halfW, 2 * halfH]);
        // Thunder always has a cloud: the bolt hangs from the deck's lower

        let boltPx = SKY.boltPx;
        const hit = thunderOn && params.get('lightning') !== '0' ? strikeAt(T, reduced) : null;
        if (thunderOn) {

            if (deckAmt > 0.35) {

                for (let k = 0; k <= steps; k++) {
                    const t = k / steps;

        }

        // ---- cloud shadows: their own layer, drifting with the wind
        const overc = smoothstep(0.55, 0.9, b.cloud);
        const nShadow = maxShadowsByTier[quality];
        const activeShadows = Math.round(lerp(Math.min(3, nShadow), nShadow, overc));
        const shadowCover = smoothstep(0.08, 0.3, b.cloud) * (1 - smoothstep(0.2, 0.7, b.fog));
        const shadowStrength = TD.shadow * lerp(1, 0.72, overc) * (1 - 0.2 * b.rain) * (1 - 0.35 * b.snow) * shadowCover;
        const span = 5.2;
        const shadowSpeed = (0.16 + 0.05 * b.wind) * lerp(1, 0.6, overc) * (reduced ? 0.4 : 1);
        let shadowCount = 0;
        for (let i = 0; i < MAX_SHADOWS; i++) {

            const cz = WIND_DIR.y * along + WIND_PERP.y * across;

        }
        stats.cloudShadows = shadowCount;

        // ---- rain
        const rainAmount = b.rain;
        const rainCount = Math.min(RAIN_CAPACITY, Math.round(RAIN_BASE * tierMul.rain * rainAmount ** 1.3 * widen));

        ru.uSizePx.value.set(5, dropLen);

        splashes.visible = splashGeometry.instanceCount > 0;
        splashMaterial.uniforms.uTime.value = T;

        splashMaterial.uniforms.uEdge.value.copy(srgb(TD.ringEdge));
        splashMaterial.uniforms.uAlpha.value = smoothstep(0.05, 0.3, rainAmount);

        const puddleAmount = smoothstep(0.25, 0.85, b.wet) * (1 - b.cover);

        stats.snow = snowGeometry.instanceCount;

        // ---- wind swooshes, in free sky only

        // ---- bolt: grows from its cloud, bounces, pulls back. No light,

        stats.flash = 0;
        stats.boltFromBand = Boolean(anchor);
        stats.boltPx = anchor ? boltPx : 0;
        if (hit && anchor) {
            const u = hit.u;
            let reveal = 1;
            let retract = 0;
            let opacity = 1;
            let widthBounce = 1;
            let glow = 0;
            if (reduced) {
                // A slow fade with ramps of a second: never a flash.
                opacity = smoothstep(0, STRIKE.reducedIn, u) * (1 - smoothstep(STRIKE.reducedIn + STRIKE.reducedHold, STRIKE.reducedIn + STRIKE.reducedHold + STRIKE.reducedOut, u));
            } else {
                reveal = smoothstep(0, STRIKE.reveal, u);

                widthBounce = 1 + 0.22 * Math.exp(-after * 9) * Math.cos(after * 26);

            }
            if (reveal > 0.01 && retract < 0.99 && opacity > 0.01) {
                const H = px(boltPx);
                const scale = H / (boltSpan[1] - boltSpan[0]);
                const out = Math.sign(anchor.rootU) || 1;
                // The root sits on the cloud's lower lip; the bolt's top 12%
                // tucks into the cloud, which draws over it.
                screenToWorld(anchor.rootU, anchor.rootV - H * 0.5 + H * 0.12, 5.9, tmpV);
                bolt.visible = true;
                bolt.position.copy(tmpV);
                bolt.quaternion.copy(camera.quaternion);
                bolt.rotateZ(hit.strike.lean * 0.5 + 0.18 * out);
                bolt.scale.set(scale * widthBounce, scale, scale);
                boltMaterial.uniforms.uOpacity.value = opacity;
                boltMaterial.uniforms.uReveal.value = reveal;
                boltMaterial.uniforms.uRetract.value = retract;
                // Glow only around the root: radius 0.3 of a 200 px cloud
                // mass, so the whole strike stays under 2% of the frame.
                bu.uGlowPos.value.set((anchor.rootU + halfW) * view.ppu, (halfH - anchor.rootV) * view.ppu, 60);
                bu.uGlow.value = 0.9 * glow;
                stats.flash = glow;
            }
        }

        if (params.get('hide') === 'particles') {
            for (const o of [rain, splashes, snow, heroFlakes, sparkles, swooshes, leaves]) o.visible = false;
        }
        if (params.get('mask') === '1') {
            // Garden-only frame on a flat background, for coverage checks.
            for (const o of [sky, cloudBand, cloudBandOverGarden, rain, splashes, snow, heroFlakes, sparkles, swooshes, leaves, bolt]) o.visible = false;
        }

        // ---- sway
        const gust = 0.75 + 0.25 * Math.sin(T * 0.7);
        for (const item of world.entities) {
            if (!item.breatheNode) continue;
            const breath = item.breathe * Math.sin(T * 1.7 + item.phase);
            item.breatheNode.scale.set(1 - breath * 0.5, 1 + breath, 1 - breath * 0.5);
            const windSway = item.windSway * b.wind * (reduced ? 0.3 : 1);
            const angle = windSway * (0.35 + 0.65 * gust * Math.sin(T * 3.1 + item.phase));
            item.breatheNode.quaternion.setFromAxisAngle(depthAxis, -angle);
            if (item.sway) item.breatheNode.rotateZ(item.sway * Math.sin(T * 1.1 + item.phase));
        }
        if (debug) drawFootprint(halfW, halfH, placed);
    }

    // ------------------------------------------------------------ UI
    const weatherGroup = document.querySelector('[data-group="weather"]');
    const timeGroup = document.querySelector('[data-group="time"]');
    const windInput = document.querySelector('[data-control="wind"]');
    const windOutput = document.querySelector('[data-output="wind"]');
    const rmInput = document.querySelector('[data-control="rm"]');
    const zoomGroup = document.querySelector('[data-group="zoom"]');
    const qualityGroup = document.querySelector('[data-group="quality"]');
    const strikeButton = document.querySelector('[data-control="strike"]');
    const ZOOMS = [['fit', 'Fit'], [75, '75 (far)'], [100, '100 (default)'], [170, '170 (garden fills the view)']];
    for (const [value, label] of ZOOMS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.zoom = String(value);
        button.textContent = label;
        button.addEventListener('click', () => {
            zoomParam = value === 'fit' ? null : value;
            resize();
            syncUi();
        });
        zoomGroup.append(button);
    }
    for (const id of ['low', 'medium', 'high']) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.quality = id;
        button.textContent = id[0].toUpperCase() + id.slice(1);
        button.addEventListener('click', () => {
            // Tier caps are set at load, like the game's quality profile.
            const url = new URL(window.location.href);
            url.searchParams.set('quality', id);
            window.location.assign(url);
        });
        qualityGroup.append(button);
    }
    strikeButton.addEventListener('click', () => {
        // One strike as soon as allowed: never sooner than 6.5 s after the
        // last one, so the button cannot make lightning flash faster.
        let t = elapsed + 0.2;
        for (let i = 0; i < 6; i++) {
            const last = lastStrikeBefore(t);
            if (t - last >= 6.5) break;
            t = last + 6.5;
        }
        manualStrike = { t, side: 1, lean: 0.05 };
        state.weather = 'storm';
        syncUi();
    });
    for (const [id, w] of Object.entries(WEATHER)) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.weather = id;
        button.textContent = w.label;
        button.addEventListener('click', () => {
            state.weather = id;
            state.windOverride = null;
            syncUi();
        });
        weatherGroup.append(button);
    }
    for (const [id, t] of Object.entries(TIMES)) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.time = id;
        button.textContent = t.label;
        button.addEventListener('click', () => {
            state.time = id;
            syncUi();
        });
        timeGroup.append(button);
    }
    windInput.addEventListener('input', () => {
        state.windOverride = Number(windInput.value);
        syncUi();
    });
    rmInput.checked = state.reduced;
    rmInput.addEventListener('change', () => {
        state.reduced = rmInput.checked;
        syncUi();
    });
    function syncUi() {
        for (const button of weatherGroup.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.weather === state.weather));
        for (const button of timeGroup.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.time === state.time));
        for (const button of zoomGroup.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.zoom === String(zoomParam ?? 'fit')));
        for (const button of qualityGroup.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.quality === quality));
        const wind = state.windOverride ?? WEATHER[state.weather].wind;
        windInput.value = String(wind);
        windOutput.textContent = String(wind);
        summary.textContent = COPY[state.weather];
        needsRender = true;
        const url = new URL(window.location.href);
        url.searchParams.set('weather', state.weather);
        url.searchParams.set('time', state.time);
        if (state.windOverride !== null) url.searchParams.set('wind', String(state.windOverride));
        else url.searchParams.delete('wind');
        if (zoomParam !== null) url.searchParams.set('zoom', String(zoomParam));
        else url.searchParams.delete('zoom');
        if (state.reduced && !prefersReduced) url.searchParams.set('rm', '1');
        else url.searchParams.delete('rm');
        if (!shotMode) window.history.replaceState(null, '', url);
    }
    function renderSpecs() {
        const rows = [
            ['Clouds', `${stats.clouds ?? 0} in the top band${stats.deck > 0.5 ? ' and a continuous deck' : ''}, ${stats.bandLimitPx ?? 0} px deep`],
            ['Cloud shadows', `${stats.cloudShadows ?? 0} moving over the garden`],
            ['Rain', stats.rain ? `${stats.rain} drops, ${stats.splashes} splash rings, ${stats.puddles} puddles` : 'none'],
            ['Snow', stats.snow ? `${stats.snow} flakes, ${stats.hero} icon flakes, ${stats.sparkles} sparkles` : blend.cover > 0.05 ? 'cover only' : 'none'],
            ['Mist', blend.fog > 0.05 ? `ground bands, ${stats.mist} rolls` : 'none'],
            ['Wind', `class ${(state.windOverride ?? WEATHER[state.weather].wind).toFixed(1)}, ${stats.swooshes ?? 0} swooshes, ${stats.leaves ?? 0} leaves`],
            ['Lightning', blend.thunder > 0.5 ? (state.reduced ? 'slow 2.6 s fade, no glow' : `one strike every 7 to 11 s${stats.boltFromBand ? ', from the top band' : ''}`) : 'none'],
            ['Motion', state.reduced ? 'Reduced: slow fall, no splashes, bolt fades' : 'Full'],
        ];
        specs.replaceChildren(
            ...rows.map(([term, value]) => {
                const row = document.createElement('div');
                const dt = document.createElement('dt');
                const dd = document.createElement('dd');
                dt.textContent = term;
                dd.textContent = value;
                row.append(dt, dd);
                return row;
            }),
        );
    }
    syncUi();

    // Debug overlay: the garden footprint and the space each sky prop keeps.
    let overlay = null;
    function drawFootprint(halfW, halfH, placed) {
        if (!overlay) {
            overlay = document.createElement('canvas');
            Object.assign(overlay.style, { position: 'absolute', inset: '0', width: '100%', height: '100%', pointerEvents: 'none' });
            stage.append(overlay);
        }
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        overlay.width = w;
        overlay.height = h;
        const g = overlay.getContext('2d');
        const toPx = (u, v) => [((u + halfW) / (2 * halfW)) * w, ((halfH - v) / (2 * halfH)) * h];
        g.lineWidth = 2;
        g.strokeStyle = 'rgba(240, 60, 120, 0.9)';
        g.beginPath();
        footprint.hull.forEach(([u, v], i) => (i ? g.lineTo(...toPx(u, v)) : g.moveTo(...toPx(u, v))));
        g.closePath();
        g.stroke();
        for (const part of footprint.parts) {
            g.beginPath();
            part.forEach(([u, v], i) => (i ? g.lineTo(...toPx(u, v)) : g.moveTo(...toPx(u, v))));
            g.closePath();
            g.stroke();
        }
        g.strokeStyle = 'rgba(40, 90, 230, 0.8)';
        for (const r of placed) {
            const [x0, y0] = toPx(r[0], r[3]);
            const [x1, y1] = toPx(r[2], r[1]);
            g.strokeRect(x0, y0, x1 - x0, y1 - y0);
        }
    }

    // ---------------------------------------------------------- frame
    function resize() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        if (!width || !height) return;
        renderer.setSize(width, height, false);
        // Pixels per world unit. The game's default zoom is 100.
        const zoom = zoomParam ?? Math.min(width / 12.8, height / 8.0);
        view.ppu = zoom;
        camera.left = -width / 2 / zoom;
        camera.right = width / 2 / zoom;
        camera.top = height / 2 / zoom;
        camera.bottom = -height / 2 / zoom;
        camera.updateProjectionMatrix();
        needsRender = true;
    }

    let specTimer = 0;
    function frame() {
        requestAnimationFrame(frame);
        const now = performance.now();
        const delta = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        if (!visible) return;
        if (frozenTime === null) elapsed += delta;
        const animating = frozenTime === null;
        if (!animating && !needsRender) return;
        needsRender = false;
        update(elapsed, delta);
        renderer.render(scene, camera);
        specTimer -= delta;
        if (specTimer <= 0 || !animating) {
            specTimer = 0.5;
            renderSpecs();
            if (debug) {
                const info = renderer.info.render;
                debugBox.textContent = [
                    `t ${elapsed.toFixed(2)} s  weather ${state.weather}  time ${state.time}  quality ${quality}`,
                    `draw calls ${info.calls}  triangles ${info.triangles}`,
                    `clouds ${stats.clouds}  rain ${stats.rain}  splashes ${stats.splashes}  snow ${stats.snow}`,
                    `mist ${stats.mist}  swooshes ${stats.swooshes}  leaves ${stats.leaves}  flash ${stats.flash.toFixed(2)}`,
                    `deck ${stats.deck}  band ${stats.bandLimitPx} px  garden top ${stats.gardenTopPx} px  over garden ${stats.bandOverGardenPct}%  shadows ${stats.cloudShadows}  zoom ${view.ppu.toFixed(0)}`,
                ].join('\n');
            }
        }
        window.__weather = {
            ready: true,
            t: elapsed,
            state: { ...state },
            blend: { ...blend },
            stats: { ...stats, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles },
            strikes: strikes.slice(0, 6).map((s) => s.t),
        };
        window.__gpsReady = true;
        window.__dbg = { clouds: bandClouds.map((c, i) => ({ i, kind: c.kind, w: Math.round(c.w), h: Math.round(c.h), lobes: c.lobes.length, screen: c.screen })), band: { ...bandState }, footprint };
    }

    const tris = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;
    window.__costs = {
        cloudTris: 2,
        fogBandTris: tris(fogGeometries[0]),
        boltTris: tris(bolt.geometry),
        swooshTris: tris(swooshGeo),
        leafTris: tris(leafGeometry),
        puddleTris: tris(puddles[0].geometry),
        buildMs: Math.round(cloudBuildMs),
        fogSize: fogGeometries.map((g) => { const z = new THREE.Vector3(); g.boundingBox.getSize(z); return z.toArray().map((x) => +x.toFixed(2)); }),
    };
    // Rough desktop GPU timing: render n frames with a sync after each.
    window.__bench = (n = 120) => {
        const gl = renderer.getContext();
        const px = new Uint8Array(4);
        const start = performance.now();
        for (let i = 0; i < n; i++) {
            update(elapsed + i / 60, 1 / 60);
            renderer.render(scene, camera);
            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        }
        return +((performance.now() - start) / n).toFixed(2);
    };
    new ResizeObserver(resize).observe(stage);
    new IntersectionObserver((entries) => {
        visible = entries.some((entry) => entry.isIntersecting);
        needsRender = true;
    }).observe(stage);
    resize();
    frame();
}
</script>
</body>
</html>
